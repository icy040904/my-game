<script>
/* =====================================================================
   AudioEngine.js —— 配乐改为加载本地 mp3；交互音效仍是现场合成

   两件事分开处理：
     · BGM  ＝ 加载 assets/ 里的 4 首 mp3，按幕切换，交叉淡入淡出，绝不硬切。
     · 音效 ＝ 继续用 Web Audio 现场合成（对话/菜单的轻响、换场景的下沉、
               走到物件前的「叮」）。这些没有对应的音频文件，而且只有几十毫秒，
               做成文件反而累赘 —— 所以它们不是「音乐」，保留合成实现。

   ── 曲目 → 场景 的映射（换歌只改 TRACKS 和 game.js 的 syncBGM）──────
     act1     第一幕：主菜单 + 卧室（现实）
     dream    第二幕：梦境里的各个场景（客厅、厨房、门口、天台、市场）
     revisit  第三幕醒来 + 第四幕故地重游
     ending   第五幕：草地结局

   ── 为什么用 HTMLAudio 放 mp3，而不是 Web Audio ──────────────────
     HTMLAudioElement 自带解码、缓冲、循环和 volume 属性。一段 40ms 的
     定时器逐个推 volume 就能做出平滑的交叉淡出，比手动 decodeAudioData +
     AudioBufferSourceNode 少写一半代码，也不用管播放位置。
   ===================================================================== */
const AudioEngine = (function () {
  'use strict';

  // ---------- 曲库 ----------
  // vol 是这一首的基准音量：四首 mp3 的响度不一定一样，混起来觉得哪首吵就调这里
  const TRACKS = {
    act1:    { src: 'assets/bgm_act1.mp3',    vol: 0.55 },
    dream:   { src: 'assets/bgm_dream.mp3',   vol: 0.55 },
    revisit: { src: 'assets/bgm_revisit.mp3', vol: 0.55 },
    ending:  { src: 'assets/bgm_ending.mp3',  vol: 0.55 },
  };

  const FADE_MIN = 1.5;      // 交叉淡入淡出时长下限（秒）——需求是「绝对不要突然切断」
  const FADE_DEF = 1.8;      // 默认时长
  const STEP_MS  = 40;       // 音量每 40ms 推一格
  const SFX_VOL  = 0.60;     // 音效总音量（BGM 走 HTMLAudio 自己的 volume，不受它影响）

  let players = {};          // name -> HTMLAudioElement
  let level   = {};          // name -> 当前音量 0..1
  let fades   = {};          // name -> {from, to, t0, dur} 正在进行的淡入淡出
  let currentName = null;
  let muted = false;
  let unlocked = false;      // 是否已经拿到过用户手势（浏览器自动播放限制）
  let timer = null;
  let ctx = null, master = null, reverb = null;   // 只给音效使用

  const hasAudio = () => typeof Audio !== 'undefined';
  const nowMs = () => (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  const baseVol = name => (muted ? 0 : (TRACKS[name] ? TRACKS[name].vol : 0));

  // ---------- BGM ----------
  function player(name) {
    if (players[name]) return players[name];
    const t = TRACKS[name];
    if (!t || !hasAudio()) return null;
    let p;
    try { p = new Audio(t.src); } catch (e) { return null; }
    p.loop = true;               // BGM 一律循环
    p.preload = 'auto';
    p.volume = 0;
    players[name] = p; level[name] = 0;
    return p;
  }

  // 让某一路音量从当前值线性走到 to，dur 秒内完成
  function retarget(name, to, dur) {
    const p = players[name];
    if (!p) return;
    fades[name] = { from: level[name] || 0, to: to, t0: nowMs(), dur: Math.max(0.05, dur) };
    ensureTimer();
  }

  function ensureTimer() {
    if (!timer) timer = setInterval(tick, STEP_MS);
  }

  function tick() {
    const t = nowMs();
    for (const name in fades) {
      const f = fades[name], p = players[name];
      if (!p) { delete fades[name]; continue; }
      let k = (t - f.t0) / (f.dur * 1000);
      if (k >= 1) k = 1;
      const v = f.from + (f.to - f.from) * k;
      level[name] = v;
      try { p.volume = v < 0 ? 0 : (v > 1 ? 1 : v); } catch (e) {}
      if (k >= 1) {
        delete fades[name];
        // 淡出到底的曲子停下并倒回开头，下次进来是从头放
        if (f.to <= 0.0001) { try { p.pause(); p.currentTime = 0; } catch (e) {} }
      }
    }
    if (!Object.keys(fades).length) { clearInterval(timer); timer = null; }
  }

  // 开始播放某一首。只在「真的出得了声」之后才开始淡入：
  //   · play() 返回的 promise 成功   → 说明这个环境允许播，开始淡入；
  //   · promise 被拒（自动播放策略） → 什么都不做，等第一次用户手势走 unlock。
  // 这样浏览器允许自动播放时，封面音乐能在第一次点击之前就响起来；
  // 不允许时也不会白白把音量推满（旧写法会在静音的暂停状态里先淡上来）。
  function beginTrack(name, dur) {
    const p = player(name);
    if (!p) return;
    try { p.currentTime = 0; p.volume = 0; } catch (e) {}
    level[name] = 0;
    let done = false;
    const go = () => {
      if (done) return;
      done = true;
      unlocked = true;                    // 出得了声，就说明不用再等手势了
      retarget(name, baseVol(name), dur);
    };
    let pr = null;
    try { pr = p.play(); } catch (e) { pr = null; }
    if (pr && typeof pr.then === 'function') pr.then(go, function () {});
    else if (p.readyState >= 3) go();
    else {
      // 老浏览器不给 promise：退回 canplay
      const on = () => { try { p.removeEventListener('canplay', on); } catch (e) {} go(); };
      try { p.addEventListener('canplay', on); } catch (e) { go(); }
    }
  }

  // 切换 BGM：至少 1.5 秒交叉淡入淡出
  function playMapBGM(name, fadeSec) {
    if (!TRACKS[name]) return;
    const dur = Math.max(FADE_MIN, fadeSec || FADE_DEF);

    if (name === currentName) {
      // 同一首不重启（重启会把旋律掐断），只确保它在放
      if (unlocked) { const p = player(name); if (p && p.paused) beginTrack(name, dur); }
      return;
    }

    const old = currentName;
    currentName = name;
    if (old && players[old]) retarget(old, 0, dur);     // 旧的淡出
    // 不预先假定「浏览器一定不放」——以前这里有一句 `if (!unlocked) return;`，
    // 等于把允许自动播放的环境也一起堵死了。现在照试不误：
    // 能放就当场响（封面音乐不用等点击），被拦下则 promise reject，静默等手势。
    beginTrack(name, dur);
  }

  // ---------- 音效（现场合成，不是音乐） ----------
  function makeImpulse(seconds, decay) {
    const rate = ctx.sampleRate, len = Math.max(1, Math.floor(rate * seconds));
    const buf = ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  function ensureCtx() {
    if (ctx) return ctx;
    const AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
    if (!AC) return null;                              // Node / 老浏览器：静默降级，不报错
    try { ctx = new AC(); } catch (e) { return null; }
    master = ctx.createGain();
    master.gain.value = muted ? 0 : SFX_VOL;
    master.connect(ctx.destination);
    reverb = ctx.createConvolver();
    reverb.buffer = makeImpulse(3.2, 2.6);             // 噪声 × 指数衰减 = 程序化混响
    const rv = ctx.createGain(); rv.gain.value = 0.70;
    reverb.connect(rv); rv.connect(master);
    return ctx;
  }

  // 一个音 ＝ 振荡器 + 音量包络；wet>0 时再送一份进混响
  function tone(freq, t0, dur, type, peak, wet) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);                 // 指数曲线不能到 0
    g.gain.linearRampToValueAtTime(peak, t0 + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; g.connect(w); w.connect(reverb); }
    o.start(t0); o.stop(t0 + dur + 0.05);
  }

  function sfx(kind) {
    if (!ensureCtx()) return;
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    const now = ctx.currentTime;

    if (kind === 'transition') {
      // 换场景：低频柔和地下沉，起落各半秒，不刺耳
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(196.00, now);                 // G3
      o.frequency.linearRampToValueAtTime(110.00, now + 1.10); // 滑到 A2
      g.gain.setValueAtTime(0.0001, now);
      g.gain.linearRampToValueAtTime(0.100, now + 0.50);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 1.20);
      o.connect(g); g.connect(master);
      o.start(now); o.stop(now + 1.30);
      return;
    }
    if (kind === 'blip')   return tone(880.00, now, 0.08, 'square', 0.030, 0);        // 对话打字/菜单移动
    if (kind === 'pickup') {                                                          // 收齐碎片
      [659.25, 783.99, 1046.50].forEach((f, i) => tone(f, now + i * 0.09, 0.40, 'sine', 0.090, 0.20));
      return;
    }
    // 'ding'：走到物件前触发对话。高频三角波 + 极快衰减，一触即散
    tone(1567.98, now, 0.55, 'triangle', 0.150, 0.35);
  }

  // ---------- 用户手势 ----------
  // 浏览器规定：出声必须发生在一次用户手势之后。unlock() 可以被反复调用。
  function unlock() {
    ensureCtx();
    if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
    if (unlocked) return;
    unlocked = true;
    if (currentName) beginTrack(currentName, 2.2);     // 把先前攒下的那首放出来
  }

  function setMuted(v) {
    muted = !!v;
    if (master && ctx) master.gain.setTargetAtTime(muted ? 0 : SFX_VOL, ctx.currentTime, 0.05);
    for (const n in TRACKS) {
      if (!players[n]) continue;                       // 没加载过的曲子不用管，免得白白去下载
      retarget(n, muted ? 0 : (n === currentName ? baseVol(n) : 0), 0.35);
    }
  }
  function isMuted() { return muted; }
  function toggleMute() { setMuted(!muted); return muted; }

  // 模块自己兜一道：任何一次点击/按键都算手势，免得调用方漏掉某条路径
  try {
    if (typeof document !== 'undefined' && document.addEventListener) {
      const once = () => {
        unlock();
        try {
          document.removeEventListener('pointerdown', once);
          document.removeEventListener('keydown', once);
          document.removeEventListener('touchstart', once);
        } catch (e) {}
      };
      document.addEventListener('pointerdown', once);
      document.addEventListener('keydown', once);
      document.addEventListener('touchstart', once);
    }
  } catch (e) {}

  const api = {
    TRACKS: TRACKS,                     // 暴露出来方便在控制台里换歌 / 调音量
    playMapBGM: playMapBGM,
    sfx: sfx,
    unlock: unlock,
    setMuted: setMuted,
    isMuted: isMuted,
    toggleMute: toggleMute,
    get current() { return currentName; },
    get ready() { return unlocked; },
  };
  if (typeof window !== 'undefined') window.AudioEngine = api;   // 给 game.js 用
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  return api;
})();
</script>

// 每张地图的角色显示倍率：第三幕卧室的底图是"近景"（家具画得特别大），
// 立绘不跟着放大就会像个微缩模型。倍率同时作用于绘制、脚下阴影和碰撞取样宽度。
const PLAYER_SCALE = { 4: 1.667 };   // 第三幕卧室：180 × 1.667 ≈ 300px 高（含阴影与碰撞取样宽度）
function playerScale() { return PLAYER_SCALE[currentMap] || 1; }

// 碰撞取样半宽（像素）。这个数按【立绘身体的真实宽度】定，不是拍脑袋 ——
// 用 _alpha_bbox.js 逐像素量过每张图的不透明范围：
//   站姿 player_side 左右各 19px；正/背面 29px；迈步帧最宽 58px（那是迈出去的脚）。
// 原来写 13：连站姿（19）都罩不住，于是"站在家具旁边、身体已经插进家具里了"。
// 改成 22：站姿和正/背面帧整块被罩住（这两类占了绝大多数时间），迈步帧只剩脚踝那几像素露在外面。
// 上限是地图里最窄的通道卡住的 —— 爷爷卧室床尾与藤椅之间只有 71px 宽（床 545、藤椅 618），
// 2×22 = 44 还留 27px 余量；再大就会把那条必经之路堵死（第一幕要靠它走到爷爷床边）。
const PLAYER_HALF = 22;

// 背景绘制：默认铺满画布；MAP_BG 里给了 zoom/dy 的会放大并下移（"拉近镜头"）
function drawMapBG(bg) {
  const name = bgImageName(currentMap);
  const zoom = bg.zoom || 1, dy = bg.dy || 0;
  let ok = true;
  if (zoom === 1 && !dy) {
    ok = ImageLoader.draw(ctx, name, 0, 0, W, H);
  } else {
    const img = ImageLoader.img(name);
    if (!img) ok = false;
    else {
      const dw = W * zoom, dh = H * zoom;
      ctx.imageSmoothingEnabled = true;              // 插画放大用平滑，避免锯齿
      ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2 + dy, dw, dh);
      ctx.imageSmoothingEnabled = false;
    }
  }
  // 叠在底图上的静态小物件：画在玩家之前，所以它们永远在玩家身后。
  // 结构 [图片名, x, y, 宽, 高]；要挡路得另在 block 里写矩形。
  // [图片名, x, y, 宽, 高, 投影半高]。有第 6 项就先在图下方铺一层椭圆投影 ——
  // 位置钉死在物件底部，不参与任何浮动，这样它才像"站"在地上。
  if (ok && bg.decor) for (const d of bg.decor) {
    if (d[5]) fillEllipse(d[1] + d[3] / 2, d[2] + d[4] - 3, d[3] * 0.55, d[5], 'rgba(0,0,0,0.26)');
    ImageLoader.draw(ctx, d[0], d[1], d[2], d[3], d[4]);
  }
  return ok;
}

function bgWalkable(bg, x, y) {
  const fy = y + 30;                              // 脚点高度
  // 按「身体宽度」取三个点判定，而不是只判脚下一个点——否则立绘会从桌角穿过去。
  // 半宽跟着立绘倍率走：立绘放大了，碰撞取样也要放宽，否则会穿模。
  const half = Math.round(PLAYER_HALF * playerScale());
  for (const dx of [-half, 0, half]) {
    const fx = x + 12 + dx;
    let ok = false;
    for (const r of bg.walk) if (fx >= r[0] && fx <= r[2] && fy >= r[1] && fy <= r[3]) { ok = true; break; }
    if (!ok) return false;
    for (const r of bg.block) if (fx >= r[0] && fx <= r[2] && fy >= r[1] && fy <= r[3]) return false;
  }
  return true;
}
// 同一个场景、两幕用不同的色温：第一幕现实偏冷，梦境回暖
function bgImageName(m) {
  if (m === 0) {
    if (act === 2) return 'map0_bg_warm';                        // 只有梦境是暖的
    // 第四幕：葬礼之后，人走了、屋子空了 —— 换成冷清版底图。
    // 图还没放进 assets/ 就自动退回原来那张，不会开天窗。
    if (act >= 4 && ImageLoader.has('map0_bg_cool')) return 'map0_bg_cool';
    return 'map0_bg';
  }
  if (m === 1) return act >= 4 ? 'map1_bg_cool' : 'map1_bg';   // 梦境暖 / 故地重游冷
  const b = MAP_BG[m];
  return b ? b.img : null;
}

function startGrassEnding() {

  endingPhase = 'grass';
  endingT = 0;

  fadeSwitch(() => {

    enterMap(3, 15, 12);
    player.dir = 'up';

function startOutro() {
  if (endingPhase === 'outro') return;
  endingPhase = 'outro';
  outroT = 0; outroStage = 0;
  syncBGM();                       // 结尾仍用结局曲，等回主菜单时才切
}

// 回到主菜单。
// 关键点：收尾结束的那一刻画面本来就是【纯黑】的，所以这里不需要"淡出再淡入"——
// 用 fadeSwitch 的话封面会先整个亮出来 0.6 秒、再黑一次、再淡进来，等于闪一下。
// 直接 arm 一个 phase='in' 的遮罩，从纯黑淡入封面即可。
// 另外 reset() 内部会把 fade 清成 null，所以它必须最先调用。
function backToTitle() {
  if (fade) return;
  reset();                         // 进度 / 碎片 / 遗物全部清干净（reset 里已经有了）
  state = 'title';
  titleT = 0; titleSel = 0; titlePanel = null;
  syncBGM();                       // 结局曲 → 主菜单曲：AudioEngine 内部做 ≥1.5s 交叉淡化
  fade = { t: 0, phase: 'in', onSwitch: function () {} };   // 从纯黑淡入封面
}

const player = {
  x: 15 * TILE, y: 12 * TILE,
  dir: 'down', flip: false, moving: false, frame: 0, anim: 0,
  // 下面这些由 update() 用缓动推进，渲染时只读 —— 不再有"硬切"
  moveAmt: 0,                          // 移动量 0..1：起步和停下都是平滑过渡
  dirBlend: 1,                         // 方向交叉淡入淡出进度（1 = 已完成）
  prevDir: 'down', prevFlip: false,    // 上一个朝向，淡出时画的就是它
  turnCd: 0,                           // 转身冷却剩余秒数
  tilt: 0                              // 转身重心倾斜（弧度），缓动回 0
};

// 方向切换：带冷却 + 交叉淡入淡出 + 转身倾斜。
// 冷却的意义是"狂按方向键时不立刻换图" —— 否则三张图会被来回切成频闪。
function setPlayerDir(dir, flip) {
  if (dir === player.dir && flip === player.flip) return;   // 没变，什么都不做
  if (player.turnCd > 0) return;                            // 冷却中，这一帧先忍着不换
  player.prevDir = player.dir; player.prevFlip = player.flip;
  player.dir = dir; player.flip = flip;
  player.dirBlend = 0;                                      // 从这里开始把新朝向淡进来
  player.turnCd = TURN_CD;
  // 左↔右转身：给一点"甩过去"的重心倾斜，再由 update 缓动回正
  if (dir === 'side' && player.prevDir === 'side' && flip !== player.prevFlip) {
    player.tilt = (flip ? 1 : -1) * TURN_TILT * Math.PI / 180;
  }
}

// ---------- 输入 ----------
const keys = {};
const pressQueue = [];
const ACTION_KEYS = ['e','E',' ','Enter','x','X','z','Z'];

// 左右同时按住时，保留「先按下的那个」方向 —— 而不是两个方向互相抵消、把人钉在原地。
// 顺序记在这个小数组里：hPress[0] 就是最先按下的那一边。
const hPress = [];
const hOf = k => (k === 'a' || k === 'A' || k === 'ArrowLeft') ? 'L'
             : (k === 'd' || k === 'D' || k === 'ArrowRight') ? 'R' : null;

// 下面这对函数是【键盘和手机虚拟键共用的唯一入口】。
// 原来这两段逻辑直接写在 keydown/keyup 监听器里；抽出来之后，手机摇杆/按钮
// 调的是同一对函数，于是触屏走的是和键盘一模一样的语义：pressQueue 去重、
// hPress 的「左右同时按住时先按下的赢」、AudioEngine 的手势解锁 —— 一套逻辑，不会走岔。
function inputDown(k) {
  const wasDown = !!keys[k];
  if (!wasDown) pressQueue.push(k);
  keys[k] = true;
  keys[k.toLowerCase()] = true;
  const h = hOf(k);
  if (h && !wasDown && hPress.indexOf(h) === -1) hPress.push(h);
  if (window.AudioEngine) AudioEngine.unlock();     // 任何按键都算一次用户手势
  if (k === 'm' || k === 'M') { toggleAudioMute(); }
  if (k === 'r' || k === 'R') { if (state !== 'title') reset(); }
}
function inputUp(k) {
  keys[k] = false;
  keys[k.toLowerCase()] = false;
  const h = hOf(k);
  if (!h) return;
  // a 和 ArrowLeft 是同一个方向，两个都松了才算这一边松开
  const still = h === 'L' ? (keys['a'] || keys['ArrowLeft']) : (keys['d'] || keys['ArrowRight']);
  if (!still) { const i = hPress.indexOf(h); if (i !== -1) hPress.splice(i, 1); }
}
window.addEventListener('keydown', (e) => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(e.key) !== -1) e.preventDefault();
  inputDown(e.key);
});
window.addEventListener('keyup', (e) => { inputUp(e.key); });

function isActionKey(k) { return ACTION_KEYS.indexOf(k) !== -1; }

const STRETCH_IMAGES = new Set(['grass', 'water', 'tree', 'path', 'floor', 'floor_living']);

const IMAGES = {};

const ImageLoader = {
  smooth: false,      // true=平滑缩放；false=最近邻(像素风锐利，本作保持 false)
  fit: 'contain',     // 'contain'=等比缩放居中(不变形) ；'stretch'=拉伸填满(会变形)

  // 启动时调用一次：全部结束（成功或失败）后回调 onDone
  load(onDone, basePath) {
    const base = basePath || 'assets/';
    for (const [name, w, h] of IMAGE_MANIFEST) IMAGES[name] = { img: null, loaded: false, w, h };
    // 无 Image 环境（如截图用的 Node 模拟器）直接结束，全部走回退
    if (typeof Image === 'undefined') { if (onDone) onDone(); return; }
    let pending = IMAGE_MANIFEST.length;
    if (pending === 0) { if (onDone) onDone(); return; }
    const finish = () => { if (--pending <= 0 && onDone) onDone(); };
    for (const [name] of IMAGE_MANIFEST) {
      const slot = IMAGES[name];
      const img = new Image();
      img.onload  = () => { slot.img = img; slot.loaded = true; finish(); };
      img.onerror = () => { finish(); };   // 缺失 → 回退
      img.src = base + name + '.png';
    }
  },

  img(name) { const s = IMAGES[name]; return (s && s.loaded) ? s.img : null; },
  has(name) { return !!(IMAGES[name] && IMAGES[name].loaded); },

  // 自动缩放绘制：有图 → 缩放后绘制，返回 true；没图 → 返回 false（调用方回退原代码）
  // 默认「等比适应」（contain）：按原图比例缩到目标框内并居中，空白透明，不变形。
  // 例外：平铺贴图必须填满整格，否则会出现透明缝隙 —— STRETCH_IMAGES 里的强制拉伸。

  draw(ctx, name, x, y, w, h, flip) {

    if (!s || !s.loaded) return false;
    const dw = w || s.w, dh = h || s.h;
    const img = s.img;
    const iw = img.width || dw, ih = img.height || dh;
    let dx = x, dy = y, rw = dw, rh = dh;

      dy = y + (dh - rh) / 2;

      ctx.save();
      ctx.translate(dx + rw, dy);
      ctx.scale(-1, 1);
      ctx.drawImage(img, 0, 0, rw, rh);
      ctx.restore();

      ctx.drawImage(img, dx, dy, rw, rh);
    }

  },

  loadedCount() { return IMAGE_MANIFEST.filter(([n]) => IMAGES[n] && IMAGES[n].loaded).length; },
  total()      { return IMAGE_MANIFEST.length; },
};

function drawSprite(rows, pal, x, y, scale, flip) {
  scale = scale || 2;
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    for (let c = 0; c < row.length; c++) {
      const src = flip ? (row.length - 1 - c) : c;
      const ch = row[src];
      if (ch === '.' || !pal[ch]) continue;
      ctx.fillStyle = pal[ch];
      ctx.fillRect(x + c * scale, y + r * scale, scale, scale);

// ---------- 碰撞 ----------
function solidAt(px, py) {

}
function blocksEntity(bx, by, bw, bh) {

    const ew = e.w || (e.sprite ? e.sprite.rows[0].length * 2 : TILE);
    const eh = e.h || (e.sprite ? e.sprite.rows.length * 2 : TILE);
    const rx = e.x + 4, ry = e.y + eh * 0.45, rw = ew - 8, rh = eh * 0.55;

}
function canMove(x, y) {

  const bg = MAP_BG[currentMap];
  if (bg) return bgWalkable(bg, x, y);           // 插画背景地图：按绘制区域判定
  if (solidAt(bx, by) || solidAt(bx + bw, by) || solidAt(bx, by + bh) || solidAt(bx + bw, by + bh)) return false;

      if (bx < f.x + f.w && bx + bw > f.x && by < f.y + f.h && by + bh > f.y) return false;
    }

// ---------- 地图切换 ----------
function buildEntities(m) {
  // act 可以是数字，也可以是数组（如 [2,4]：第二幕梦境与第四幕故地重游共用同一张图和出口）
  entities = entityDefs.filter(e => e.map === m && (e.act === undefined ||
    (Array.isArray(e.act) ? e.act.indexOf(act) !== -1 : e.act === act)) && (!e.when || e.when()))
    .map(e => ({ ...e, x: e.tx * TILE, y: e.ty * TILE }));
}
// 出生点自检：若被家具/实体占住，就近找一个空位（且不落在出口格上，避免来回传送）
function findFreeSpawn(tx, ty) {
  const bad = (c, r) => {
    if (!canMove(c * TILE, r * TILE)) return true;
    const pcx = c * TILE + 12, pcy = r * TILE + 16;
    for (const e of entities) {
      if (e.type !== 'exit') continue;
      if (pcx >= e.x && pcx <= e.x + TILE && pcy >= e.y && pcy <= e.y + TILE) return true;
    }
    return false;
  };

  for (let rad = 1; rad <= 40; rad++) {
    for (let dy = -rad; dy <= rad; dy++) {
      for (let dx = -rad; dx <= rad; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== rad) continue;
        const c = tx + dx, r = ty + dy;
        if (c < 1 || r < 1 || c >= MAP_W - 1 || r >= MAP_H - 1) continue;

  buildEntities(m);                       // 先建实体，出生点才能避开它们

    // 第四幕：故地重游的进场旁白（只播一次）
    if (act >= 4 && !act4Arrived) {
      act4Arrived = true;
      pendingAuto = { t: 0.6, fn(){ startDialogue(ACT4.arrive, () => {}); } };
    }
  } else if (m === 0) {
    if (act === 1 && !act1Arrived) {
      act1Arrived = true;
      pendingAuto = { t: 0.6, fn(){ startDialogue(ACT1.arrive, () => {}); } };
    } else if (act === 2 && !act2Opened) {
      act2Opened = true;
      pendingAuto = { t: 0.6, fn(){ startDialogue(ACT2.open, () => {}); } };
    } else if (act >= 4 && !act4RoomArrived) {

      pendingAuto = { t: 0.6, fn(){ startDialogue(ACT4.room, () => {}); } };

function fadeSwitch(onSwitch) {
  fade = { t: 0, phase: 'out', onSwitch };
}

// ---------- 对话系统 ----------
function startDialogue(lines, onEnd) {
  state = 'dialogue';
  dialogue = { lines, idx: 0, charIdx: 0, timer: 0, onEnd };
  player.moving = false;
  playBlip();
}
function advanceDialogue() {
  const line = dialogue.lines[dialogue.idx];
  // 选择行 ['choice', 问题, [{label, then, mark}]]：不走打字机，等玩家选好再按确认。
  // 选定后把该选项的后续台词插到当前位置后面，再往下走。
  if (line && line[0] === 'choice') {
    const opt = line[2][dialogue.sel || 0];
    if (opt.mark) relicMarks.add(opt.mark);
    if (opt.then) dialogue.lines.splice(dialogue.idx + 1, 0, ...opt.then);
    dialogue.sel = 0;
    dialogue.idx++;
    dialogue.charIdx = 0;
    playBlip();
    return;
  }
  if (dialogue.charIdx < line[1].length) {
    dialogue.charIdx = line[1].length;
    return;
  }
  dialogue.idx++;
  dialogue.charIdx = 0;
  // 第三幕：第一句「我睁开眼睛」翻页 → 小满在床边淡入，移动同时解禁
  if (wakeFadeArmed && dialogue.idx >= 1) { wakeFadeArmed = false; playerFadeIn = true; }
  if (dialogue.idx >= dialogue.lines.length) {
    const onEnd = dialogue.onEnd;
    dialogue = null;
    state = 'play';
    if (onEnd) onEnd();
  } else {
    playBlip();
  }
}

// ---------- 星星 / 横幅 ----------
function playerCenter() { return { x: player.x + 12, y: player.y + 16 }; }
function entityCenter(e) {
  const w = e.w || (e.sprite ? e.sprite.rows[0].length * 2 : TILE);
  const h = e.h || (e.sprite ? e.sprite.rows.length * 2 : TILE);
  return { x: e.x + w / 2, y: e.y + h / 2 };
}
function nearestInteractable() {
  const pc = playerCenter();
  let best = null, bd = RANGE;
  for (const e of entities) {
    if (e.type !== 'npc' && e.type !== 'obj') continue;
    if (!e.onInteract) continue; // 纯装饰家具不可交互
    const ec = entityCenter(e);
    const d = Math.hypot(ec.x - pc.x, ec.y - pc.y);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}
function tryInteract() {
  const e = nearestInteractable();
  if (e && e.onInteract) {
    if (window.AudioEngine) AudioEngine.sfx('ding');   // 走到物件前触发对话 → 一声温柔的「叮」
    const lines = e.onInteract();
    startDialogue(lines, e.onEnd || (() => {}));
  }
}

// 静音开关（右上角小喇叭 / M 键 / 设置面板 三处共用）
function audioMuted() {
  return window.AudioEngine ? AudioEngine.isMuted() : false;
}
function toggleAudioMute() {
  if (window.AudioEngine) AudioEngine.toggleMute();
  playBlip();
}

// 当前该放哪一首。按幕切换（曲目表见 AudioEngine.js）：
//   主菜单 / 第一幕 → act1      第二幕梦境 → dream
//   第三幕醒来 + 第四幕故地重游 → revisit      第五幕草地结局 → ending
function syncBGM() {
  if (!window.AudioEngine) return;
  if (state === 'title') { AudioEngine.playMapBGM('act1'); return; }   // 主菜单就用第一幕那一首
  if (state === 'ending' || act >= 5) { AudioEngine.playMapBGM('ending'); return; }
  if (act === 2) { AudioEngine.playMapBGM('dream'); return; }
  if (act >= 3) { AudioEngine.playMapBGM('revisit'); return; }
  AudioEngine.playMapBGM('act1');

// ---------- 开始 / 重置 ----------
function startGame() {
  if (fade) return;                    // 已经在淡出了，别重复触发
  if (window.AudioEngine) AudioEngine.unlock();   // 点「开始游戏」本身就是一次用户手势
  // 先复位到第一幕，但画面仍压回封面 —— 否则淡出的黑屏期间会漏出游戏画面。
  // 复位必须放在起过渡「之前」：reset() 内部会把 fade 清成 null。
  reset();
  state = 'title';
  fadeSwitch(() => { state = 'play'; });   // 淡出封面 → 切场景 → 淡入第一幕
}
function reset() {

  flowerDone = false;

  dialogue = null;
  banner = null;
  pendingAuto = null;
  endingT = 0;
  endingPhase = 'bed';
  grassLine = 0; grassFade = 0; grassCd = 0;
  outroT = 0; outroStage = 0;
  titlePanel = null;
  titleSel = 0;
  act1Done = false;
  act1Arrived = false;
  // ↓ 这几项以前漏了：从第二/三/四幕按 R 重开，会停在原来的幕次和进度上
  act = 1;
  act2Opened = false;
  act4Arrived = false;
  act4RoomArrived = false;
  frags = new Set();
  reported = new Set();
  memoryFragmentsCollected = 0;
  relicSeen = new Set();
  relicMarks = new Set();
  playerLying = false;
  player.x = 15 * TILE; player.y = 12 * TILE;
  player.dir = 'down'; player.flip = false; player.moving = false; player.frame = 0; player.anim = 0;
  player.moveAmt = 0; player.dirBlend = 1; player.prevDir = 'down'; player.prevFlip = false;
  player.turnCd = 0; player.tilt = 0;
  enterMap(0, 17, 13);          // 第一幕：爷爷的卧室
  state = 'play';
}

// ---------- 更新 ----------
function handlePress(k) {
  if (state === 'title') {
    if (titlePanel) {                       // 设置 / 告别面板
      if (titlePanel === 'settings' && (isActionKey(k) || k === 'Enter')) { toggleAudioMute(); }
      else if (isActionKey(k) || k === 'Enter' || k === 'Escape') titlePanel = null;
      return;
    }
    if (k === 'ArrowUp' || k === 'w' || k === 'W') { moveTitleSel(-1); return; }
    if (k === 'ArrowDown' || k === 's' || k === 'S') { moveTitleSel(1); return; }
    if (isActionKey(k) || k === 'Enter') { activateTitleItem(titleSel); return; }
    return;
  }
  if (state === 'ending') {
    if (endingPhase === 'grass') {
      // 第五幕草地：一次按键推进一句，不自动、也不给跳。
      // 本句还没淡完、或还在冷却里，这一下就忽略 —— 防狂按乱跳的那道闸。
      const isGo = (k === ' ' || k === 'e' || k === 'E' || k === 'Enter');
      if (isGo && grassCd <= 0 && grassFade >= GRASS_FADE) {
        if (grassLine < ENDING_GRASS.length - 1) {
          grassLine++; grassFade = 0; grassCd = GRASS_CD;
          playBlip();
        } else {
          startOutro();          // 最后一句之后再按一次 → 进入收尾（压黑 + 告别文字）
        }
      }
      return;
    }
    if (endingPhase === 'outro') {
      // 文字出来之后，任意键都能回主菜单
      if (outroStage === 1) backToTitle();
      return;
    }
    // 旧版病床 / 山顶 / 尾声仍然是「按键加速」
    if (endingPhase === 'bed') endingT += BED_LINE_T;
    else if (endingPhase === 'hill') endingT += HILL_LINE_T;
    else endingT += EPI_LINE_T;
    return;
  }
  if (state === 'dialogue') {
    const line = dialogue.lines[dialogue.idx];
    if (line && line[0] === 'choice') {
      // 选择行：上下（或 W/S、A/D）切换，动作键确认
      const n = line[2].length, cur = dialogue.sel || 0;
      if (k === 'ArrowUp' || k === 'w' || k === 'W' || k === 'a' || k === 'A') { dialogue.sel = (cur + n - 1) % n; playBlip(); }
      else if (k === 'ArrowDown' || k === 's' || k === 'S' || k === 'd' || k === 'D') { dialogue.sel = (cur + 1) % n; playBlip(); }
      else if (isActionKey(k) || k === 'Enter') advanceDialogue();
      return;
    }
    if (isActionKey(k)) advanceDialogue();
    return;
  }
  if (state === 'play') {
    if (isActionKey(k)) {
      if (banner) { banner = null; return; }
      tryInteract();
    }
  }
}

function update(dt) {
  time += dt;

  // ---- 运动表现的推进 ----
  // 放在所有状态判断之前：这样即使中途进了对话或结局，已经起头的方向淡入、
  // 重心倾斜也会自己收敛完，不会僵在"半透明"或"歪着"的状态里。
  if (state !== 'play') player.moving = false;     // 不变量：没在游玩状态就一定不在走
  if (player.turnCd > 0) player.turnCd = Math.max(0, player.turnCd - dt);
  if (player.dirBlend < 1) player.dirBlend = Math.min(1, player.dirBlend + dt / TURN_FADE);
  // moveAmt 用指数平滑逼近 0/1：起步慢慢摇起来，松手平滑收住，不是硬切
  player.moveAmt += ((player.moving ? 1 : 0) - player.moveAmt) * Math.min(1, dt / MOVE_EASE);
  player.tilt *= Math.max(0, 1 - dt / 0.22);        // 转身倾斜：缓动回正

        f.onSwitch();

        if (fade === f) { fade.phase = 'in'; fade.t = 0; }

  if (state === 'title') { titleT += dt; return; }   // 封面：只推进入场动效

  // 立绘淡入（第三幕醒来）。放在这里，是因为对话状态下 update 会提前 return
  if (playerFadeIn) {
    playerAlpha = Math.min(1, playerAlpha + dt / 0.8);
    if (playerAlpha >= 1) { playerAlpha = 1; playerFadeIn = false; }

    dialogue.timer += dt;
    dialogue.charIdx += dt * 42;
    return;
  }

  if (state === 'ending') {

      if (grassFade < GRASS_FADE) grassFade = Math.min(GRASS_FADE, grassFade + dt);
      if (grassCd > 0) grassCd = Math.max(0, grassCd - dt);
      return;

  // 之后每帧都在上面提前 return，人就永远"在对话里原地摇摆"了。

  // 直接相加（-1+1=0）会让人站在原地 —— 玩家会以为卡住了。

    // 这里直接用归一化之前的原始输入判断，避免两个 0.7071 相比时的浮点相等问题。
    // （侧面立绘原始朝向 = 朝左，所以往左不镜像、往右镜像。写反了左右都会"倒着走"。）
    // 真正换图交给 setPlayerDir：它带冷却和交叉淡入淡出，不硬切。
    if (dx) setPlayerDir('side', dx > 0);
    else setPlayerDir(dy < 0 ? 'up' : 'down', false);

    let mx = dx, my = dy;
    if (dx && dy) { mx *= 0.7071; my *= 0.7071; }   // 斜向不加速
    const nx = player.x + mx * PLAYER_SPEED * dt;
    const ny = player.y + my * PLAYER_SPEED * dt;
    if (canMove(nx, player.y)) player.x = nx;
    if (canMove(player.x, ny)) player.y = ny;

  }

  // 贴着地图边缘的出口（厨房 tx:0、门口 tx:1）需要玩家能走到 x≤20；
  // 一旦在这儿夹住，人就永远够不到门口 —— 直接被锁死在地图里出不去。

  // 朝向一变位置就被推一下，正是"来回切换"的观感来源。
  // 现在只在【画的时候】夹，player.x 原样不动。

      if (e.setAct) act = e.setAct;          // 有的门同时推进幕次（如：出门 → 第四幕·故地重游）
      if (e.onEnter) e.onEnter();            // 有的门不只是换图（如：走出爷爷的屋子 → 第五幕·草地）
      else enterMap(e.target.m, e.target.tx, e.target.ty);
      break;
    }
  }
}

// ---------- 渲染 ----------
function drawSpriteObj(s, x, y, scale, flip) {
  drawSprite(s.rows, s.pal, x, y, scale, flip);
}
function getPlayerSprite() {
  let rows, flip = player.flip;
  if (player.dir === 'down') rows = player.frame ? playerDownB : playerDownA;
  else if (player.dir === 'up') rows = player.frame ? playerUpB : playerUpA;
  else { rows = player.frame ? playerSideB : playerSideA; }
  return { rows, pal: PLAYER_PAL, flip };
}
// 插画立绘：尺寸直接读素材本身，不再写死数字
function getPlayerImageName() {
  const dir = player.dir === 'side' ? 'side' : player.dir;
  return 'player_' + dir;
}
// 侧面走路：一条循环＝【侧身迈一步 → 侧面站直 → 侧身再迈一步 → 侧面站直】，缺图就退回静态立绘。
// 站立那一拍用【侧面站立】player_side.png —— 就是停下不走时画的那张，同一朝向、同一站姿，
// 换到它不会突然转身（用正面图 player_down 会，所以不能拿它当中间拍）。
// 为什么中间非要插一拍照站立：这批 AI 素材【没有"另一条腿在前"的帧】（每张表都只画了同一条腿在前），
// 光靠侧身帧换不出两条腿交替。站立那一拍两条腿并拢，正好把上一步那条腿"收回来"，
// 于是整条循环读起来是【迈—收—迈—收】，而不是一直同一条腿迈在前面。
const WALK_FRAMES = ['player_walk0', 'player_side', 'player_walk2', 'player_side'];
// 两条侧身迈步帧取手上最不一样的两张（同一条腿在前，差别在步幅）：
//   walk0＝一步落稳（近腿在前、双脚落地），walk2＝一步迈到最大（近腿伸到最前、另一条腿拉到最后）。
// 换帧之间照旧用 0.05 秒淡入淡出（见 walkFrameBlend / WALK_BLEND），硬切会"顿"一下。
// player_walk1 / player_walk3 是同一批导出的备用帧，这版循环里没用上，文件留着不删。
// 每帧停留秒数（按需求试 0.2 秒换一帧）。换帧时长只影响步频节奏和"脚会不会蹭地"，
// 看着太快/太慢就调这里；脚底打滑就往小调，像小碎步挪动就往大调。
const WALK_FRAME_T = 0.2;
// 地图 4 的立绘放大 1.667 倍（第三幕卧室是近景），步幅跟着放大 —— 周期必须按同样倍数放大，
// 否则那个近景里脚会往后蹭，而且画面越大越显眼。
function walkFrameT() { return WALK_FRAME_T * playerScale(); }
const WALK_BLEND   = 0.05;      // 换帧时上一帧的淡出时长（秒）：相邻两帧姿势有差，硬切会"顿"一下
const WALK_OFFSET_Y = [0, 0, 0, 0];  // 每帧的 Y 微调（像素）。踩地线在导出时就已经对齐了
                                     // （每帧脚底都落在图片最后一行，静态立绘也是这个规矩），
                                     // 所以这里全 0；留着是为了以后换素材时不动代码就能微调。
function walkFrameIndex() {
  return Math.floor(player.anim / walkFrameT()) % WALK_FRAMES.length;
}
function walkFrameName() {
  if (player.dir !== 'side' || player.moveAmt < 0.15) return null;
  for (const n of WALK_FRAMES) if (!ImageLoader.has(n)) return null;
  return WALK_FRAMES[walkFrameIndex()];
}
// 换帧过渡：当前帧始终完整绘制，上一帧在换帧后的 WALK_BLEND 秒内淡出叠在上面。
// 返回 null = 不需要过渡（或压根不用走路帧）。这样 walkFrameName() 说的那帧
// 永远就是画面主体，探针看到的名字和实际画的图不会对不上。
function walkFrameBlend() {
  if (player.dir !== 'side' || player.moveAmt < 0.15) return null;
  for (const n of WALK_FRAMES) if (!ImageLoader.has(n)) return null;
  const n = WALK_FRAMES.length;
  const ph = player.anim / walkFrameT();
  const f = ph - Math.floor(ph);                               // 本帧内进度 0..1
  const fade = 1 - Math.min(1, f * walkFrameT() / WALK_BLEND); // 上一帧的残留不透明度 1 → 0
  if (fade <= 0.01) return null;                               // 过渡结束，按普通单帧画
  const pi = (Math.floor(ph) - 1 + n * 2) % n;
  return { prev: WALK_FRAMES[pi], prevIdx: pi, fade: fade };
}
// 单帧的镜像：侧身帧（含侧面站立的 player_side）跟着朝向镜像；正面/背面立绘本身面向镜头、
// 左右对称，镜像没有意义（还会让头发分缝之类的小不对称左右乱跳），所以一律不镜像。
function walkFrameFlip(name) {
  return (name === 'player_down' || name === 'player_up') ? false : player.flip;
}
// 走路循环里各帧的图宽差得远（侧身迈步帧 118px，侧面站立帧只有 38px）。
// 贴到屏幕边缘时要把"画的横坐标"夹进屏幕，夹多少跟图宽走 —— 要是按【当前这一帧】算，
// 沿着地图左/右边缘走的时候，身体会每 0.2 秒横跳 40px，看上去就是"左右来回切"。
// 所以夹取宽度取整个循环里最宽的那一帧，循环内保持一致。
let walkCycleW = 0, walkCycleWmin = 0;
function walkCycleWidth() {
  if (!walkCycleW) for (const n of WALK_FRAMES) {
    const im = ImageLoader.img(n);
    if (im && im.width > walkCycleW) walkCycleW = im.width;
  }
  return walkCycleW;
}
// 脚底影子用哪张图的宽度：取循环里【最窄】的那一帧（就是侧面站立那张，38px）。
// 影子宽度要是跟着当前帧走，走起来就会每 0.2 秒在"迈步时 54 宽的影子"和"站立时 18 宽的影子"
// 之间弹一下，而且一起步/一停步还突跳 —— 统一用站立那张的宽度，
// 站姿和走姿的影子就是同一个大小（停下时画的也正是这一张）。
function walkCycleShadowW() {
  if (!walkCycleWmin) {
    let m = Infinity;
    for (const n of WALK_FRAMES) {
      const im = ImageLoader.img(n);
      if (im && im.width > 0 && im.width < m) m = im.width;
    }
    walkCycleWmin = (m < Infinity) ? m : 60;
  }
  return walkCycleWmin;
}
// 椭圆（用多边形近似，保证所有渲染器都能画）
function fillEllipse(cx, cy, rx, ry, color) {
  ctx.beginPath();
  const N = 22;
  for (let i = 0; i <= N; i++) {
    const a = i / N * Math.PI * 2;
    const x = cx + Math.cos(a) * rx, y = cy + Math.sin(a) * ry;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}
// 立绘绘制：锚点＝脚底中心，支持旋转与镜像
function drawArtRotated(name, cx, feetY, flip, rot) {
  const img = ImageLoader.img(name);
  if (!img) return false;
  const k = playerScale();
  const w = (img.width || 60) * k, h = (img.height || 180) * k;
  ctx.save();
  ctx.translate(cx, feetY);
  if (rot) ctx.rotate(rot);
  if (flip) ctx.scale(-1, 1);
  ctx.imageSmoothingEnabled = ImageLoader.smooth;
  ctx.drawImage(img, -w / 2, -h, w, h);
  ctx.restore();
  return true;
}

function drawBackground() {
  if (MAPS[currentMap].night || state === 'title') {
    ctx.fillStyle = '#141129';
    ctx.fillRect(0, 0, W, H);
    drawStarfield();
  } else {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);
  }
}

// 星星背景（预生成）
// 位置用写死的伪随机（原来是 Math.random，每次刷新星星都在跳，截图也不稳定）
const starsBg = [];
for (let i = 0; i < 90; i++) {
  starsBg.push({
    x: (i * 197 + 43) % W,
    y: ((i * 331 + 17) % Math.round(H * 0.85)),
    s: i % 3 === 0 ? 2 : 1,
    p: (i * 0.7) % 6.28,
  });
}
function drawStarfield() {
  for (const st of starsBg) {
    const a = 0.35 + 0.35 * Math.sin(time * 2 + st.p);
    ctx.globalAlpha = Math.max(0.05, a);
    ctx.fillStyle = '#e8e4ff';
    ctx.fillRect(st.x, st.y, st.s, st.s);
  }
  ctx.globalAlpha = 1;
}

// 梦境漂浮光点
const dreamParticles = [];
for (let i = 0; i < 40; i++) {
  dreamParticles.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() < 0.4 ? 2 : 1, p: Math.random() * 6.28, sp: 6 + Math.random() * 16 });
}
// 枯萎花绽放后的花粉粒子（预生成，飘散在花周围）
const pollen = [];
for (let i = 0; i < 9; i++) {
  pollen.push({ dx: Math.random() * 36 - 18, dy: Math.random() * 22, s: Math.random() < 0.4 ? 2 : 1, p: Math.random() * 6.28, sp: 7 + Math.random() * 10 });
}
function drawDreamParticles() {
  for (const d of dreamParticles) {
    let yy = (d.y - time * d.sp) % H; if (yy < 0) yy += H;
    const a = 0.25 + 0.25 * Math.sin(time * 2 + d.p);
    ctx.globalAlpha = Math.max(0.04, a);
    ctx.fillStyle = '#ffe2a8';
    ctx.fillRect(d.x, yy, d.s, d.s);
  }
  ctx.globalAlpha = 1;
}

function drawTiles() {
  const grid = MAPS[currentMap].grid;
  for (let r = 0; r < MAP_H; r++) {
    const row = grid[r] || '';
    for (let c = 0; c < MAP_W; c++) {
      const ch = row[c];
      if (!ch) continue;
      const t = TILES[ch];
      const isMap1Grass = (currentMap === 1 && (t.grass || t.flower || ch === '#')); // 地图1草地统一底色
      // 树 / 路：有 PNG 时整格用图（无装饰，直接 continue）
      if ((ch === 'T' || ch === '=') && ImageLoader.draw(ctx, ch === 'T' ? 'tree' : 'path', c * TILE, r * TILE, TILE, TILE)) continue;
      const tx0 = c * TILE, ty0 = r * TILE;
      if (t.wall) {
        // 石灰墙面：顶沿受光 → 底部渐暗，撒斑驳点；下方若是地面则加一道深木踢脚线
        ctx.fillStyle = '#c9c0ae';
        ctx.fillRect(tx0, ty0, TILE, TILE);
        ctx.fillStyle = '#ded6c6';
        ctx.fillRect(tx0, ty0, TILE, 4);
        ctx.fillStyle = '#b3a996';
        ctx.fillRect(tx0, ty0 + TILE - 10, TILE, 10);
        ctx.fillStyle = '#a2988a';
        ctx.fillRect(tx0, ty0 + TILE - 4, TILE, 4);
        for (let k = 0; k < 5; k++) {
          const hx = (c * 37 + r * 19 + k * 13) % 28;
          const hy = 6 + ((c * 23 + r * 31 + k * 7) % 18);
          ctx.fillStyle = (c + r + k) % 2 ? '#bdb3a1' : '#d6cec0';
          ctx.fillRect(tx0 + hx, ty0 + hy, 2, 2);
        }
        const below = (grid[r + 1] || '')[c];
        const tb = TILES[below];
        if (tb && !tb.solid) {
          ctx.fillStyle = '#6b4a32';
          ctx.fillRect(tx0, ty0 + TILE - 7, TILE, 7);
          ctx.fillStyle = '#4a3222';
          ctx.fillRect(tx0, ty0 + TILE - 2, TILE, 2);
        }
      } else {
        ctx.fillStyle = isMap1Grass ? '#6B9C4A' : t.c;
        ctx.fillRect(tx0, ty0, TILE, TILE);
      }
      // 墙投在地面上的阴影：本格可走、正上方是墙 → 顶部压一道渐隐暗带
      if (!t.solid && currentMap !== 1) {
        const ta = TILES[(grid[r - 1] || '')[c]];
        if (ta && ta.wall) {
          for (let i = 0; i < 7; i++) {
            ctx.fillStyle = 'rgba(28,18,48,' + (0.17 * (1 - i / 7)).toFixed(3) + ')';
            ctx.fillRect(tx0, ty0 + i, TILE, 1);
          }
        }
      }
      if (t.window) {
        if (row[c - 1] !== 'v') {
          if (!ImageLoader.draw(ctx, 'moon', c * TILE + 1, r * TILE + 1, 16, 16)) drawSprite(moonSprite, MOON_PAL, c * TILE + 1, r * TILE + 1, 2);
          ctx.fillStyle = '#8ea0c8';
          ctx.fillRect(c * TILE + 22, r * TILE + 5, 2, 2);
          ctx.fillRect(c * TILE + 26, r * TILE + 13, 2, 2);
          ctx.fillRect(c * TILE + 24, r * TILE + 21, 3, 2);
        }
      }
      if (isMap1Grass || t.grass) {
        if (currentMap === 1) {
          // 草地贴图优先；缺失则回退到抖动草地质感
          // 交替镜像，打散 32px 网格感
          if (!ImageLoader.draw(ctx, 'grass', c * TILE, r * TILE, TILE, TILE, (c + r) % 2 === 1)) {
            // 草地质感：深绿/浅绿 1-2px 点按坐标哈希无规律交错撒布（Dithering）
            for (let k = 0; k < 6; k++) {
              const hx = 1 + ((c * (31 + k * 13) + r * (17 + k * 29)) % 30);
              const hy = 1 + ((c * (13 + k * 23) + r * (29 + k * 11)) % 30);
              const sz = ((c + r + k) % 3 === 0) ? 1 : 2;
              ctx.fillStyle = (c * 5 + r * 7 + k * 3) % 2 === 0 ? '#5C8B3E' : '#7DAD5B';
              ctx.fillRect(c * TILE + hx, r * TILE + hy, sz, sz);
            }
            // 草地边缘：靠非草地一侧撒几根深绿短线草叶
            const gq = (rr, cc) => {
              if (cc < 0 || rr < 0 || rr >= MAP_H || cc >= MAP_W) return false;
              const q = (grid[rr] || '')[cc];
              return q === '.' || q === ',' || q === 'g' || q === 'f' || q === '#';
            };
            if (!gq(r, c - 1) || !gq(r, c + 1) || !gq(r - 1, c) || !gq(r + 1, c)) {
              ctx.fillStyle = '#5C8B3E';
              ctx.fillRect(c * TILE + 4 + ((c * 7 + r * 11) % 21), r * TILE + 25, 1, 3);
              ctx.fillRect(c * TILE + 11 + ((c * 13 + r * 5) % 13), r * TILE + 23, 1, 3);
            }
          }
          // 花草 f：2×2 花瓣 + 1px 绿茎 + 叶片（画在草地上，图片/回退皆叠加）
          if (t.flower) {
            ctx.fillStyle = '#e58fb1';
            ctx.fillRect(c * TILE + 14, r * TILE + 19, 2, 2);
            ctx.fillRect(c * TILE + 13, r * TILE + 20, 1, 1);
            ctx.fillRect(c * TILE + 16, r * TILE + 20, 1, 1);
            ctx.fillStyle = '#5C8B3E';
            ctx.fillRect(c * TILE + 15, r * TILE + 21, 1, 4);
            ctx.fillRect(c * TILE + 13, r * TILE + 23, 2, 1);
            ctx.fillRect(c * TILE + 17, r * TILE + 24, 2, 1);
          }
          // 小石子：3×3 灰块 + 左下角 2×2 深灰（体积感）
          if ((c * 53 + r * 37) % 17 === 0) {
            const px2 = c * TILE + 3 + ((c * 29 + r * 11) % 21);
            const py2 = r * TILE + 21 + ((c * 7 + r * 19) % 6);
            ctx.fillStyle = '#8A8A8A';
            ctx.fillRect(px2, py2, 3, 3);
            ctx.fillStyle = '#6A6A6A';
            ctx.fillRect(px2, py2 + 1, 2, 2);
          }
          // 野花：1px 绿茎 + 顶端 2×2 花瓣（黄/紫）
          if ((c * 41 + r * 23) % 23 === 0) {
            const wx = c * TILE + 4 + ((c * 17 + r * 31) % 22);
            const wy = r * TILE + 15 + ((c * 11 + r * 7) % 9);
            ctx.fillStyle = (c + r) % 2 === 0 ? '#c9a0d8' : '#e8c97a';
            ctx.fillRect(wx, wy, 2, 2);
            ctx.fillStyle = '#5C8B3E';
            ctx.fillRect(wx, wy + 2, 1, 3);
          }
        } else {
          // 其他地图：有草地贴图则用图，否则保留原有草叶、小石子与野花点
          if (!ImageLoader.draw(ctx, 'grass', c * TILE, r * TILE, TILE, TILE)) {
            const g1 = (c * 31 + r * 17) % 3;
            const g2 = (c * 13 + r * 29) % 3;
            ctx.fillStyle = '#5d8647';
            ctx.fillRect(c * TILE + 6 + g1 * 6, r * TILE + 18, 2, 6);
            ctx.fillRect(c * TILE + 16 + g2 * 4, r * TILE + 21, 2, 5);
            ctx.fillStyle = '#4e743d';
            ctx.fillRect(c * TILE + 12 + g1 * 5, r * TILE + 20, 2, 4);
            ctx.fillStyle = '#8fb96b';
            ctx.fillRect(c * TILE + 22 + g2 * 3, r * TILE + 17, 2, 3);
            if ((c * 53 + r * 37) % 17 === 0) {
              ctx.fillStyle = '#8a8a8a';
              ctx.fillRect(c * TILE + 4 + ((c * 29 + r * 11) % 22), r * TILE + 22 + ((c * 7 + r * 19) % 7), 2, 2);
            }
            if ((c * 41 + r * 23) % 23 === 0) {
              const wx = c * TILE + 3 + ((c * 17 + r * 31) % 24);
              const wy = r * TILE + 14 + ((c * 11 + r * 7) % 12);
              ctx.fillStyle = (c + r) % 2 === 0 ? '#c9a0d8' : '#e8c97a';
              ctx.fillRect(wx, wy, 1, 1);
              ctx.fillRect(wx + 2, wy + 1, 1, 1);
              ctx.fillRect(wx + 1, wy + 2, 1, 1);
              ctx.fillRect(wx + 3, wy + 2, 1, 1);
            }
          }
        }
      }
      if (t.tuft) {
        if (currentMap === 1) {
          // 地图1：茂盛草簇改用短线（≤4px）表现
          ctx.fillStyle = '#5C8B3E';
          for (let k = 0; k < 4; k++) {
            const bx = c * TILE + 4 + ((c * 7 + r * 13 + k * 11) % 22);
            const by = r * TILE + 12 + ((c * 13 + r * 7 + k * 17) % 14);
            ctx.fillRect(bx, by, 1, 2 + ((c + r + k) % 3));
          }
          ctx.fillStyle = '#7DAD5B';
          ctx.fillRect(c * TILE + 6 + ((c * 5 + r * 11) % 18), r * TILE + 13 + ((c * 9 + r * 3) % 12), 1, 3);
        } else {
          // 其他地图保留原有
          ctx.fillStyle = '#6f9b52';
          ctx.fillRect(c * TILE + 9, r * TILE + 14, 2, 10);
          ctx.fillRect(c * TILE + 15, r * TILE + 11, 2, 12);
          ctx.fillRect(c * TILE + 21, r * TILE + 14, 2, 9);
          ctx.fillStyle = '#7fae5e';
          ctx.fillRect(c * TILE + 12, r * TILE + 12, 2, 7);
          ctx.fillRect(c * TILE + 18, r * TILE + 13, 2, 6);
        }
      }
    }
  }
  // 大门门板与把手：独立绘制，避免被后续地砖覆盖
  for (let r = 0; r < MAP_H; r++) {
    const row = grid[r] || '';
    for (let c = 0; c < MAP_W; c++) {
      const ch = row[c];
      if (!ch || !TILES[ch].door) continue;
      const isTop = !(grid[r - 1] && grid[r - 1][c] === 'D');
      const isLeft = row[c - 1] !== 'D';
      if (!isTop || !isLeft) continue;
      let w = 1, h = 1;
      while (row[c + w] === 'D') w++;
      while (grid[r + h] && grid[r + h][c] === 'D') h++;
      const x = c * TILE, y = r * TILE;
      const ww = w * TILE, hh = h * TILE;
      ctx.fillStyle = '#7a4526';
      ctx.fillRect(x + 6, y + 6, ww - 12, hh - 12);
      ctx.fillStyle = '#5a2f18';
      ctx.fillRect(x + 10, y + 10, ww - 20, hh - 20);
      ctx.fillStyle = '#3d2a12';
      ctx.fillRect(x + 12, y + Math.floor(hh / 2) - 1, ww - 24, 2);
      ctx.fillRect(x + Math.floor(ww / 2) - 1, y + 12, 2, hh - 24);
      ctx.fillStyle = '#e8c97a';
      ctx.fillRect(x + ww - 16, y + Math.floor(hh / 2) - 1, 3, 3);
    }
  }
  // 场景装饰（空地图）：与瓦片同层，受下方夜晚滤镜影响，融入夜色
  const deco = MAP_DECOR[currentMap];
  if (deco) for (const d of deco) drawSprite(d.spr, d.pal, d.x, d.y, d.scale || 2);

  // 夜晚氛围
  if (MAPS[currentMap].night) {
    ctx.fillStyle = 'rgba(24,20,60,0.38)';
    ctx.fillRect(0, 0, W, H);
  }
}

// ---------- 地图 0 装饰：木地板纹理 + 冷色暗角 + 月光 + 家具投影 ----------
function tileHash(n) {
  n = (n ^ 61) ^ (n >>> 16);
  n = Math.imul(n, 0x27d4eb2d) ^ (n >>> 15);
  n = n ^ (n >>> 14);
  return n >>> 0;
}

function drawFloorTile(cx, cy, off, rows, pal) {
  for (let r = 0; r < 16; r++) {
    const row = rows[(r + off) % 16];
    for (let c = 0; c < 16; c++) {
      const ch = row[c];
      if (ch === '.' || !pal[ch]) continue;
      ctx.fillStyle = pal[ch];
      ctx.fillRect(cx + c * 2, cy + r * 2, 2, 2);
    }
  }
}

function groundShadow(x, y, w, h) {
  // 统一光源：左上方（窗户月光）→ 投影落右下方；形状随家具宽高缩放，不再所有家具两条固定矩形
  const sh = Math.max(3, Math.round(h * 0.10));   // 底影高度（随家具高）
  const sw = Math.max(3, Math.round(w * 0.06));   // 侧影宽度（随家具宽）
  ctx.fillStyle = 'rgba(30,20,60,0.28)';
  ctx.fillRect(x + 3, y + h - sh + 2, w, sh);        // 底部阴影条（落右下）
  ctx.fillRect(x + w - sw + 3, y + 3, sw, h - sh);   // 右侧阴影条
}

function drawMoonPatch(m) {
  // 梯形月光：极淡蓝紫 + 左右边缘像素抖动（Dithering）过渡，顶部自上而下渐隐
  const y0 = Math.max(0, Math.floor(m.y1));
  const y1 = Math.min(H - 1, Math.ceil(m.y3));
  for (let y = y0; y <= y1; y += 2) {
    const t = (y - m.y1) / (m.y3 - m.y1);
    const xL = m.x1 + (m.x4 - m.x1) * t;
    const xR = m.x2 + (m.x3 - m.x2) * t;
    const base = m.aTop + (m.aBot - m.aTop) * t;
    for (let x = Math.floor(xL / 2) * 2; x <= xR; x += 2) {
      const dL = x - xL, dR = xR - x;
      const edge = Math.min(dL, dR);
      let a = base;
      if (edge < 8) {
        a = base * (0.25 + 0.75 * edge / 8);
        if (((x >> 1) + (y >> 1)) & 1) a *= 0.55;   // 棋盘格抖动，让边缘淡开
      }
      if (a < 0.008) continue;
      ctx.fillStyle = 'rgba(' + m.r + ',' + m.g + ',' + m.b + ',' + a.toFixed(3) + ')';
      ctx.fillRect(x, y, 2, 2);
    }
  }
}

function drawMapDecor() {
  if (currentMap !== 0) return;
  const grid = MAPS[0].grid;

  // 1) 地面材质：w=卧室直纹木 / n=厅堂人字拼 / y=厨房·卫生间方砖，逐瓦片确定性错位
  for (let r = 0; r < MAP_H; r++) {
    for (let c = 0; c < MAP_W; c++) {
      const ch = grid[r][c];
      const px = c * TILE, py = r * TILE;
      if (ch === 'w') {
        const off = tileHash(c * 73856093 + r * 19349663) % 16;
        if (ImageLoader.draw(ctx, 'floor', px, py, TILE, TILE)) continue;
        drawFloorTile(px, py, off, FLOOR, FLOOR_PAL);
      } else if (ch === 'n') {
        const off = tileHash(c * 73856093 + r * 19349663) % 16;
        if (ImageLoader.draw(ctx, 'floor_living', px, py, TILE, TILE)) continue;
        drawFloorTile(px, py, off, FLOOR_LIVING, FLOOR_LIVING_PAL);
      } else if (ch === 'y') {
        drawFloorTile(px, py, 0, FLOOR_TILE, FLOOR_TILE_PAL);   // 砖缝不偏移，否则对不齐
      }
    }
  }

  // 1b) 地板受光：左房偏冷月光（越靠左越蓝），右房偏暖灯光（越靠右越暖），极淡叠加
  for (let c = 0; c < MAP_W; c++) {
    const x = c * TILE;
    if (c < 15) {
      ctx.fillStyle = 'rgba(120,140,190,' + (0.055 * (1 - c / 15)).toFixed(3) + ')';
    } else {
      ctx.fillStyle = 'rgba(255,200,120,' + (0.050 * ((c - 15) / 15)).toFixed(3) + ')';
    }
    ctx.fillRect(x, 0, TILE, H);
  }

  // 2) 床周围一圈极淡冷色暗角
  const bed = FURN.find(f => f.id === 'bed');
  const vcx = bed.x + bed.w / 2, vcy = bed.y + bed.h / 2;
  const vg = ctx.createRadialGradient(vcx, vcy, 42, vcx, vcy, 150);
  vg.addColorStop(0, 'rgba(34,26,66,0)');
  vg.addColorStop(1, 'rgba(34,26,66,0.16)');
  ctx.fillStyle = vg;
  ctx.fillRect(vcx - 150, vcy - 110, 300, 220);

  // 3) 爷爷卧室的窗户在 col2-6，月光自左上斜落进房间（梯形 + 边缘像素抖动）
  drawMoonPatch({ x1: 64, y1: 32, x2: 224, y2: 32, x3: 268, y3: 250, x4: 28, y4: 250, r: 150, g: 160, b: 210, aTop: 0.09, aBot: 0.05 });
  drawMoonPatch({ x1: 80, y1: 32, x2: 208, y2: 32, x3: 240, y3: 232, x4: 56, y4: 232, r: 168, g: 176, b: 224, aTop: 0.07, aBot: 0.04 });

  // 3b) 厅堂暖黄环境光（餐厅方向）+ 落地灯局部光
  const warm = ctx.createRadialGradient(700, 400, 60, 700, 400, 320);
  warm.addColorStop(0, 'rgba(255,214,140,0.11)');
  warm.addColorStop(1, 'rgba(255,190,110,0)');
  ctx.fillStyle = warm;
  ctx.fillRect(380, 80, 580, 464);
  // 灯晕中心绑定到落地灯实际位置（lamp 在 640,192，灯罩下方约 y=228）
  const lamp = FURN.find(f => f.id === 'lamp');
  const lx = lamp.x + lamp.w / 2, ly = lamp.y + lamp.h;
  const lampGlow = ctx.createRadialGradient(lx, ly, 8, lx, ly, 90);
  lampGlow.addColorStop(0, 'rgba(255,214,140,0.18)');
  lampGlow.addColorStop(1, 'rgba(255,190,110,0)');
  ctx.fillStyle = lampGlow;
  ctx.fillRect(lx - 90, ly - 90, 180, 180);

  // 4) 家具投影 + 家具本体（先投影后本体，保证叠放顺序）
  for (const f of FURN) groundShadow(f.x, f.y, f.w, f.h);
  for (const f of FURN) {
    if (!ImageLoader.draw(ctx, FURN_IMG[f.id] || f.id, f.x, f.y, f.w, f.h)) {
      drawSprite(f.spr, f.pal, f.x, f.y, f.scale || 2);
    }
  }
}

function drawWater() {
  const grid = MAPS[currentMap].grid;
  const isWater = (rr, cc) => {
    if (cc < 0 || rr < 0 || rr >= MAP_H || cc >= MAP_W) return false;
    const t2 = TILES[(grid[rr] || '')[cc]];
    return !!(t2 && t2.water);
  };
  let minC = MAP_W, maxC = -1, minR = MAP_H, maxR = -1;
  for (let r = 0; r < MAP_H; r++) {
    const row = grid[r] || '';
    for (let c = 0; c < MAP_W; c++) {
      const t = TILES[row[c]];
      if (!t || !t.water) continue;
      minC = Math.min(minC, c); maxC = Math.max(maxC, c);
      minR = Math.min(minR, r); maxR = Math.max(maxR, r);
      // 水面贴图优先；缺失则回退水底深蓝 + 波光 + 阳光反射
      if (!ImageLoader.draw(ctx, 'water', c * TILE, r * TILE, TILE, TILE, (c + r) % 2 === 1)) {
        // 水底深蓝（整格铺底）
        ctx.fillStyle = '#3A6E8C';
        ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
        // 波光：浅蓝 2×1 横向短线，坐标哈希散落
        for (let k = 0; k < 3; k++) {
          const wx = c * TILE + 4 + ((c * 31 + r * 17 + k * 29) % 22);
          const wy = r * TILE + 4 + ((c * 17 + r * 29 + k * 13) % 24);
          ctx.fillStyle = '#6AA2C4';
          ctx.fillRect(wx, wy, 2, 1);
        }
        // 阳光反射：偶尔一点白色 1×1
        if ((c * 23 + r * 37) % 7 === 0) {
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(c * TILE + 6 + ((c * 41 + r * 13) % 20), r * TILE + 6 + ((c * 13 + r * 41) % 20), 1, 1);
        }
      }
      // 池塘岸：深棕 1px 泥土线，顺水形自然生成
      ctx.fillStyle = '#4A3426';
      if (!isWater(r, c - 1)) ctx.fillRect(c * TILE, r * TILE, 1, TILE);
      if (!isWater(r, c + 1)) ctx.fillRect(c * TILE + TILE - 1, r * TILE, 1, TILE);
      if (!isWater(r - 1, c)) ctx.fillRect(c * TILE, r * TILE, TILE, 1);
      if (!isWater(r + 1, c)) ctx.fillRect(c * TILE, r * TILE + TILE - 1, TILE, 1);
      // 四角切 3px 斜边（草地色补角），打破矩形，拐角用像素点过渡
      const noU = !isWater(r - 1, c), noD = !isWater(r + 1, c);
      const noL = !isWater(r, c - 1), noR = !isWater(r, c + 1);
      ctx.fillStyle = '#6B9C4A';
      if (noU && noL) { ctx.fillRect(c * TILE, r * TILE, 3, 1); ctx.fillRect(c * TILE, r * TILE + 1, 2, 1); ctx.fillRect(c * TILE, r * TILE + 2, 1, 1); }
      if (noU && noR) { ctx.fillRect(c * TILE + TILE - 3, r * TILE, 3, 1); ctx.fillRect(c * TILE + TILE - 2, r * TILE + 1, 2, 1); ctx.fillRect(c * TILE + TILE - 1, r * TILE + 2, 1, 1); }
      if (noD && noL) { ctx.fillRect(c * TILE, r * TILE + TILE - 3, 1, 1); ctx.fillRect(c * TILE, r * TILE + TILE - 2, 2, 1); ctx.fillRect(c * TILE, r * TILE + TILE - 1, 3, 1); }
      if (noD && noR) { ctx.fillRect(c * TILE + TILE - 1, r * TILE + TILE - 3, 1, 1); ctx.fillRect(c * TILE + TILE - 2, r * TILE + TILE - 2, 2, 1); ctx.fillRect(c * TILE + TILE - 3, r * TILE + TILE - 1, 3, 1); }
    }
  }
  if (maxC < 0) return; // 当前地图没有水
  const px = minC * TILE, py = minR * TILE;
  const pw = (maxC - minC + 1) * TILE, ph = (maxR - minR + 1) * TILE;
  // 水草：岸边几条斜向深绿短线
  const weed = (x, y) => {
    ctx.fillStyle = '#3a5a2a';
    ctx.fillRect(x, y, 2, 2); ctx.fillRect(x + 2, y + 2, 2, 2); ctx.fillRect(x + 4, y + 4, 2, 3);
  };
  weed(px + 10, py + ph - 20);
  weed(px + 30, py + ph - 12);
  weed(px + pw - 34, py + 10);
  // 荷叶：底部深绿阴影线压在水面 + 深绿圆盘 + 中心高光
  for (const [lx, ly, lr] of [[px + 40, py + 88, 5], [px + 116, py + 56, 4], [px + 78, py + 100, 3]]) {
    ctx.fillStyle = '#25451E';
    ctx.fillRect(lx - lr + 1, ly + lr + 1, lr * 2 - 2, 1);
    for (let dy = -lr; dy <= lr; dy++) {
      for (let dx = -lr; dx <= lr; dx++) {
        const d2 = dx * dx + dy * dy;
        if (d2 > lr * lr) continue;
        ctx.fillStyle = d2 <= (lr * 0.42) * (lr * 0.42) ? '#5d8a46' : '#3a5a2a';
        ctx.fillRect(lx + dx, ly + dy, 1, 1);
      }
    }
  }
  // 两条鱼儿在池塘里往返游动（大小与速度错开）
  for (let i = 0; i < 2; i++) {
    const spd = i === 0 ? 14 : 28;
    const scale = i === 0 ? 3 : 2;
    const span = pw - 30;
    const cycle = (time * spd + i * 70) % (span * 2);
    const flip = cycle >= span; // 返程向左游
    const fx = cycle < span ? cycle : span * 2 - cycle;
    const fy = py + 8 + i * 18 + Math.sin(time * 2 + i * 2) * 3;
    if (!ImageLoader.draw(ctx, 'fish', px + 4 + fx, fy, 10 * scale, 9 * scale, flip)) {
      drawSprite(fishSprite, FISH_PAL, px + 4 + fx, fy, scale, flip);
    }
  }
}

function drawExits() {
  for (const e of entities) {
    if (e.type !== 'exit') continue;
    if (e.draw) { e.draw(e.x, e.y); continue; }
    const bob = Math.sin(time * 4) * 2;
    const flip = e.dir === 'l';
    if (!ImageLoader.draw(ctx, 'arrow_right', e.x + 4, e.y + 8 + bob, 24, 24, flip)) {
      drawSprite(arrowRight, ARROW_PAL, e.x + 4, e.y + 8 + bob, 2, flip);
    }
  }
}

function drawActors() {
  const list = [];
  for (const e of entities) {
    if (e.type !== 'npc' && e.type !== 'obj') continue;
    if (e.hide) continue;              // 已画进背景插画里的人物/物件，不再重复绘制
    if (e.draw) {
      list.push({ y: e.y + (e.h || TILE), draw(){ e.draw(e.x, e.y); } });
      continue;
    }
    list.push({ y: e.y + (e.sprite.rows.length * 2), draw() {
      if (e.id === 'flower') {
        // 花朵：图片优先（绽开/枯萎两态），缺失回退字符画 + 茎叶种子
        const imgName = flowerDone ? 'flower_bloom' : 'flower_wilted';
        if (!ImageLoader.draw(ctx, imgName, e.x, e.y)) {
          drawSpriteObj(SPR(flowerDone ? flowerBloom : flowerWilted, FLOWER_PAL), e.x, e.y);
          if (!flowerDone) {
            // 枯萎花：枯黄茎 + 散落的种子（仅回退时叠加）
            ctx.fillStyle = '#b09858';
            ctx.fillRect(e.x + 20, e.y + 26, 2, 5);
            ctx.fillRect(e.x + 18, e.y + 30, 2, 4);
            ctx.fillStyle = '#8a5a30';
            ctx.fillRect(e.x + 6, e.y + 30, 2, 2);
            ctx.fillRect(e.x + 24, e.y + 32, 2, 2);
            ctx.fillRect(e.x + 12, e.y + 33, 2, 2);
          }
        }
        if (flowerDone) {
          // 花粉粒子：极淡黄点缓慢上飘（图片/回退都叠加）
          for (const pt of pollen) {
            let yy = pt.dy - time * pt.sp;
            if (yy < -18) yy += 42;
            ctx.globalAlpha = Math.max(0.05, 0.32 + 0.18 * Math.sin(time * 2 + pt.p));
            ctx.fillStyle = '#ffe2a8';
            ctx.fillRect(e.x + 16 + pt.dx, e.y + 16 + yy, pt.s, pt.s);
          }
          ctx.globalAlpha = 1;
        }
      } else if (!(e.img && ImageLoader.draw(ctx, e.img, e.x, e.y))) {
        drawSpriteObj(e.sprite, e.x, e.y);
      }
    }});
  }
  const ps = getPlayerSprite();
  list.push({ y: player.y + 32, draw() {
    if (playerAlpha <= 0.01) return;                 // 第三幕开场：人还没出现（第一句旁白翻页后才淡入）
    // 第五幕草地：新底图里已经画着小满躺在草地上了，所以这里什么都不画 ——
    // 再叠一个旋转 90° 的站立立绘会出现两个小满。只 return，不参与碰撞。
    if (playerLying === 'grass') return;
    const walkName = walkFrameName();                       // 侧面走路时换成循环里的一帧
    const name = walkName || getPlayerImageName();
    const img = ImageLoader.img(name);
    // 脚底中心 = 碰撞盒底边中点。但立绘比身体宽得多（侧身迈步帧 118px），
    // 贴到屏幕边缘时要把【画的位置】夹进屏幕，player.x 本身绝对不动 ——
    // 动了位置的话，厨房那种贴边出口就永远走不到了。
    const fy = player.y + 32;
    // 夹取宽度【整个循环统一】：站立那一拍只有 38px 宽，按它自己夹的话，
    // 贴着地图边缘走时身体会每 0.2 秒横跳 40px —— 那就成了"左右来回切"。
    const clampW = (walkName ? walkCycleWidth() : 0) || (img && img.width) || 60;
    const halfDraw = clampW * playerScale() / 2;
    const cx = Math.min(Math.max(player.x + 12, halfDraw), W - halfDraw);
    ctx.globalAlpha = playerAlpha;                   // 第三幕醒来时淡入
    if (img) {
      const k = playerScale();                       // 第三幕卧室是"近景"，立绘要放大
      const w = (img.width || 60) * k, h = (img.height || 180) * k;
      // ---- 伪走路动画（素材只有三张图，全靠这两行做运动感）----
      // 全部乘 moveAmt（0..1 的缓动量）：起步时慢慢摇起来、松手后平滑收住，
      // 而不是一按就满幅、一松就僵死。
      const amt = player.moveAmt;
      const ph  = player.anim * WALK_FREQ;
      // 上下：正弦，幅度 ±2px。以前写的是 -|sin|*3 —— |sin| 永远朝上、频率还翻倍，
      // 那正是"一蹦一蹦的僵尸"的元凶。
      const bob  = Math.sin(ph * 2) * BOB_MAX * amt;
      // 左右：改叫"重心倾斜"，±2°，频率是上下的一半（一步倾一次），再叠加转身的 tilt
      const lean = Math.sin(ph) * (SWAY_DEG * Math.PI / 180) * amt;
      const rot  = lean + player.tilt;
      // 脚底椭圆阴影：位置永远钉在 fy，绝对不参与 bob。
      // 影子一旦跟着立绘上下飘，人就立刻像浮在半空——这是"脚踏实地"的关键。
      // 宽度也【不跟当前帧走】：走路时用站立那张的宽（见 walkCycleShadowW），
      // 否则影子会跟着迈步/站立每 0.2 秒一胀一缩。
      const sw = (walkName ? walkCycleShadowW() : w);
      fillEllipse(cx, fy - 1, sw * 0.46, sw * 0.15, 'rgba(0,0,0,0.30)');
      // 镜像按【单帧】判（循环里有侧面站立的 player_side）：侧身帧跟朝向，正面/背面帧不镜像，
      // 见 walkFrameFlip()。
      // 方向切换：旧朝向淡出 + 新朝向淡入（TURN_FADE 秒），绝不硬切
      let baseA = playerAlpha;
      if (player.dirBlend < 1 && (player.prevDir !== player.dir || player.prevFlip !== player.flip)) {
        ctx.globalAlpha = playerAlpha * (1 - player.dirBlend);
        drawArtRotated('player_' + player.prevDir, cx, fy + bob,
                       player.prevDir === 'side' ? player.prevFlip : false, rot);
        baseA = playerAlpha * player.dirBlend;
      }
      // 当前帧完整画出来（名字始终对得上 walkFrameName()）
      const wf = walkFrameBlend();
      ctx.globalAlpha = baseA;
      drawArtRotated(name, cx, fy + bob + (WALK_OFFSET_Y[walkFrameIndex()] || 0), walkFrameFlip(name), rot);
      // 上一帧在换帧后的 0.05 秒内淡出叠在上面 —— 两帧姿势差得远，硬切会"顿"一下
      if (wf) {
        ctx.globalAlpha = baseA * wf.fade;
        drawArtRotated(wf.prev, cx, fy + bob + (WALK_OFFSET_Y[wf.prevIdx] || 0), walkFrameFlip(wf.prev), rot);
      }
    } else {
      drawSprite(ps.rows, ps.pal, player.x, player.y, 2, ps.flip);
    }
    ctx.globalAlpha = 1;
  }});
  list.sort((a, b) => a.y - b.y);
  for (const item of list) item.draw();
}

function drawIndicator() {
  if (state !== 'play') return;
  const e = nearestInteractable();
  if (!e) return;
  const ec = entityCenter(e);
  const bob = Math.sin(time * 5) * 2;
  const bx = ec.x, by = e.y - 18 + bob;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(bx - 9, by - 9, 18, 18);
  ctx.fillStyle = '#2a2430';
  ctx.fillRect(bx - 7, by - 7, 14, 14);
  text('!', bx, by + 1, 16, '#ffffff', 'center', true);
  text('E', bx, by - 26, 12, '#e8c97a', 'center', true);
}

// 底图没画门：在出口位置放一张手绘木质箭头（assets/arrow_next.png，抠图见 _arrow_import.js）。
// 原图朝右，按 dir 旋转；长短边始终按原图比例，不拉伸。图没加载出来才退回代码画的多边形。
const ARROW_ART = 'arrow_next';
const ARROW_LEN = 58;              // 长边像素数（比原来的代码箭头大一圈，手绘木牌看清木纹才好看）
function drawExitHint() {
  if (act !== 2 && act !== 3 && act !== 4) return;   // 第三幕卧室也要有箭头，否则玩家会以为是死路
  for (const e of entities) {
    if (e.type !== 'exit' || !e.hint) continue;
    // 贴着屏幕边缘的出口，提示往里收一点，免得箭头被切掉
    const cx = Math.min(Math.max(e.x + 16, 48), W - 48);
    const cy = Math.min(Math.max(e.y + 6, 28), H - 56);
    // 呼吸：透明度 + 上下轻浮共用一个相位，看起来才像"一口气"，而不是两段动画各走各的
    const ph = time * 2.2 + (e.tx + e.ty) * 0.7;
    ctx.globalAlpha = 0.45 + 0.55 * Math.abs(Math.sin(ph));
    const bob = Math.sin(ph) * 2.5;
    ctx.save();
    ctx.translate(cx, cy + bob);
    if (e.dir === 'l') ctx.rotate(Math.PI);
    else if (e.dir === 'd') ctx.rotate(Math.PI / 2);
    else if (e.dir === 'u') ctx.rotate(-Math.PI / 2);
    const img = ImageLoader.img(ARROW_ART);
    if (img && img.width) {
      const w = ARROW_LEN, h = w * img.height / img.width;   // 等比，不拉扁
      ctx.imageSmoothingEnabled = true;                       // 手绘插画放大要平滑，别出锯齿
      ctx.drawImage(img, -w / 2, -h / 2, w, h);
      ctx.imageSmoothingEnabled = false;
    } else {
      // 兜底：原来的代码箭头（只在图缺失时才会看到）
      ctx.fillStyle = '#e07a9a';
      ctx.beginPath();
      ctx.moveTo(-26, -12); ctx.lineTo(-2, -12); ctx.lineTo(-2, -28);
      ctx.lineTo(22, 0); ctx.lineTo(-2, 28); ctx.lineTo(-2, 12);
      ctx.lineTo(-26, 12); ctx.closePath(); ctx.fill();

// 圆角矩形路径（折线近似，兼容所有渲染器）
function roundRect(x, y, w, h, r) {
  const c = [[x + r, y], [x + w - r, y], [x + w, y + r], [x + w, y + h - r],

  ctx.beginPath();
  c.forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])));
  ctx.closePath();
}
function drawHUD() {
  // 挂牌高度 62（不是 54）：厨房/天台底图左上角的「AI 生成」徽标下沿到 y≈62，
  // 高度 54 时会在牌子底下露出 1~4px，加高才能完全盖住。
  // 手机上整块挂牌再放大 uiS() 倍：手机屏幕离眼睛更远，24px 的星星和 26px 的数字看不清。
  // 放大是安全的 —— 这块牌子只会把底图左上角的「AI 生成」水印盖得更严实。
  const s = uiS();
  const px = 4, py = 4, pw = Math.round(148 * s), ph = Math.round(62 * s), r = 6;
  // 轻微黑色阴影（偏移的深色块，规则不允许 shadowBlur）
  roundRect(px + 2, py + 3, pw, ph, r);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fill();
  // 做旧木质挂牌
  roundRect(px, py, pw, ph, r);
  ctx.fillStyle = 'rgba(44,30,15,0.96)';
  ctx.fill();
  // 磨损痕迹：边缘几处浅色小痕
  ctx.fillStyle = 'rgba(150,116,70,0.32)';
  for (let i = 0; i < 6; i++) {
    const t = (i * 53 + 11) % (pw - 24);
    ctx.fillRect(px + 12 + t, (i % 2) ? py + 3 : py + ph - 5, 3 + (i % 3), 2);
  }
  // 内侧深木边
  ctx.fillStyle = 'rgba(35,20,8,0.35)';
  ctx.fillRect(px + 5, py + 4, pw - 10, 2);
  ctx.fillRect(px + 5, py + ph - 6, pw - 10, 2);
  ctx.fillRect(px + 4, py + 5, 2, ph - 10);
  ctx.fillRect(px + pw - 6, py + 5, 2, ph - 10);
  // ⭐ 1/5
  ctx.globalAlpha = 0.9;
  const st = Math.round(24 * s), sx = px + Math.round(14 * s), sy = py + Math.round(19 * s);
  if (!ImageLoader.draw(ctx, 'hud_star', sx, sy, st, st)) drawSprite(hudStar, STAR_PAL, sx, sy, 2);
  ctx.globalAlpha = 1;
  ctx.font = 'bold ' + Math.round(26 * s) + 'px Georgia, "Times New Roman", serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#eddcb0';
  ctx.fillText(memoryFragmentsCollected + '/' + FRAG_TOTAL, px + Math.round(48 * s), py + Math.round(33 * s));
}

function drawBanner() {

  ctx.globalAlpha = a;

function drawDialogue() {
  if (!dialogue) return;
  // 手机上整块放大 uiD() 倍：字号、行高、行距、头像、内边距一起放大，可见行数不变。
  // 逻辑画布仍是 960×544，所以放大只改这里的数值，不动布局系统。
  const s = uiD();
  const LH = Math.round(26 * s);                                     // 正文行高
  const boxX = 24, boxY = H - Math.round(132 * s), boxW = W - 48, boxH = Math.round(118 * s);
  ctx.fillStyle = 'rgba(14,12,26,0.92)';
  ctx.fillRect(boxX, boxY, boxW, boxH);
  ctx.fillStyle = '#e8c97a';
  ctx.fillRect(boxX, boxY, boxW, 3);
  ctx.fillRect(boxX, boxY + boxH - 3, boxW, 3);

  const line = dialogue.lines[dialogue.idx];

  // 选择行：问题 + 竖排选项，选中项高亮
  if (line[0] === 'choice') {
    setFont(Math.round(19 * s), false);
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#f2efe6';
    ctx.fillText(line[1], boxX + 26, boxY + Math.round(20 * s));
    line[2].forEach((opt, i) => {
      const oy = boxY + Math.round(56 * s) + i * Math.round(30 * s), on = i === (dialogue.sel || 0);
      if (on) { ctx.fillStyle = 'rgba(232,201,122,0.16)'; ctx.fillRect(boxX + 18, oy - 3, boxW - 36, Math.round(26 * s)); }
      text((on ? '▶ ' : '   ') + opt.label, boxX + 30, oy + Math.round(9 * s), Math.round(19 * s), on ? '#e8c97a' : '#b8b0d8', 'left', on);
    });
    ctx.textBaseline = 'middle';
    return;
  }

  const spk = SPEAKERS[line[0]];
  const textX = boxX + 20, textY = boxY + Math.round(16 * s);
  const textW = boxW - 40;

  // 立绘头像：有图用图（76×76，手机放大到 uiD() 倍），没有就回退字符画小人
  const PW = Math.round(76 * s), hasArt = !!(spk.img && ImageLoader.has(spk.img));
  if (spk.name) {
    text(spk.name, textX + (hasArt ? PW + Math.round(14 * s) : 0), textY, Math.round(16 * s), spk.color, 'left', true);
  } else {
    text('…', textX, textY, Math.round(16 * s), '#8b83a8', 'left', true);
  }
  if (hasArt) ImageLoader.draw(ctx, spk.img, textX, textY + Math.round(4 * s), PW, PW);
  else if (spk.sprite) drawSprite(spk.sprite.rows, spk.sprite.pal, textX, textY + Math.round(26 * s), 2);

  const reveal = line[1].slice(0, Math.floor(dialogue.charIdx));
  setFont(Math.round(19 * s), false);
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#f2efe6';
  const indent = hasArt ? PW + Math.round(14 * s) : (spk.sprite ? 60 : 0);
  const maxW = textW - indent;
  let cx = textX + indent, cy = textY + Math.round(28 * s);
  let cur = '';
  for (const ch of reveal) {
    if (ctx.measureText(cur + ch).width > maxW) {
      ctx.fillText(cur, cx, cy); cur = ch; cy += LH;
      if (cy > boxY + boxH - LH) break;
    } else cur += ch;
  }
  ctx.fillText(cur, cx, cy);
  ctx.textBaseline = 'middle';

  if (dialogue.charIdx >= line[1].length) {
    const bob = Math.sin(time * 5) * 3;
    text('▼', boxX + boxW - 30, boxY + boxH - Math.round(22 * s) + bob, Math.round(14 * s), '#e8c97a', 'center', true);
  }
}

// ================= 封面 =================
const GAME_TITLE = "再见，小星星";
// 菜单项：enabled === false 的会变灰、不可选也不可点
const TITLE_MENU = [
  { id: 'start',    label: 'Start Game' },
  { id: 'continue', label: 'Continue', enabled: false },   // 还没有存档系统，先变灰
  { id: 'settings', label: 'Settings' },

const TITLE_Y = 394;         // 主标题中心 y（原 402，往上让 8px 给菜单腾空间）

function drawTitle() {
  // ① 底图：封面插画 + 极慢推近（Ken Burns）；没有图就回退到程序生成的星空
  const cover = ImageLoader.img('cover_bg');
  if (cover) {
    const p = Math.min(1, titleT / 26);                        // 26 秒推完，慢到几乎察觉不到
    const k = 1.0 + 0.06 * p;
    const dw = W * k, dh = dw * (cover.height / cover.width);
    const dx = (W - dw) / 2 + Math.sin(titleT * 0.06) * 12;    // 极缓的左右游移
    const dy = (H - dh) / 2 - p * 10;                          // 同时极缓上移
    ctx.imageSmoothingEnabled = true;                          // 插画用平滑缩放
    ctx.drawImage(cover, dx, dy, dw, dh);
    ctx.imageSmoothingEnabled = false;

    // ② 呼吸感：整幅以约 1% 的幅度极缓明暗起伏。
    //    只作用在画面上（在文字之前画），菜单和标题不会跟着闪。
    const br = 0.5 + 0.5 * Math.sin(titleT * 0.55);
    ctx.fillStyle = 'rgba(255,246,220,' + (0.004 + 0.010 * br).toFixed(4) + ')';
    ctx.fillRect(0, 0, W, H);
  } else {
    drawBackground();
  }

  // ③ 压暗：下重上轻，保证标题和菜单读得清。
  //    优先用线性渐变；环境不支持才退回分带近似（分带会留下横向色带）。
  if (typeof ctx.createLinearGradient === 'function') {
    const g = ctx.createLinearGradient(0, H * 0.30, 0, H);
    g.addColorStop(0, 'rgba(6,5,14,0)');
    g.addColorStop(0.55, 'rgba(6,5,14,0.22)');
    g.addColorStop(1, 'rgba(6,5,14,0.46)');
    ctx.fillStyle = g;
    ctx.fillRect(0, H * 0.30, W, H * 0.70);
  } else {
    for (let i = 0; i < 24; i++) {
      const t = i / 23;
      ctx.fillStyle = 'rgba(6,5,14,' + (0.02 + t * 0.38).toFixed(3) + ')';
      ctx.fillRect(0, H * (0.30 + 0.70 * t), W, H * 0.70 / 24 + 1);
    }
  }

  // ④ 缓缓上飘的光点（位置写死，不用随机数——截图才稳定）
  for (let i = 0; i < 26; i++) {
    const bx = ((i * 173) % 940) + 8;
    const by = H - (((i * 311) % 560) + titleT * (6 + (i % 5) * 4)) % 560;
    ctx.globalAlpha = 0.12 + 0.26 * Math.abs(Math.sin(titleT * 0.7 + i * 1.3));
    ctx.fillStyle = i % 4 === 0 ? '#ffe9b0' : '#dfe4ff';
    const s = i % 6 === 0 ? 2 : 1;
    ctx.fillRect(bx, by, s, s);
  }
  ctx.globalAlpha = 1;

  // ⑤ 主标题：复古衬线体 + 柔和黑色投影（偏移画两遍；规则禁 shadowBlur）
  const a1 = Math.min(1, titleT / 1.2);
  const ty = TITLE_Y + (1 - a1) * 12;
  ctx.globalAlpha = a1 * 0.6;
  text(GAME_TITLE, W / 2 + 2, ty + 3, 30, '#000000', 'center', true);
  ctx.globalAlpha = a1;
  text(GAME_TITLE, W / 2, ty, 30, '#f0dfae', 'center', true);
  ctx.globalAlpha = 1;

  // ⑥ 菜单（晚 0.5 秒淡入）
  const a2 = Math.min(1, Math.max(0, (titleT - 0.5) / 1.0));
  if (a2 > 0) {
    ctx.globalAlpha = a2;
    if (titlePanel) drawTitlePanel(); else drawTitleMenu();
    ctx.globalAlpha = 1;
  }

  // ⑦ 键盘提示：贴到屏幕最下沿、压到 0.5 透明 —— 安静的角落 UI，
  // 绝对不和菜单抢垂直空间（原来画在 H-16=528，跟 Quit Game(530) 叠在一起）。
  if (titleT > 2.5 && !titlePanel) {
    ctx.globalAlpha = 0.5;
    text('↑ ↓ 选择　·　空格 / 回车 确认', W / 2, H - 10, 11, '#9a93b8', 'center', false);
    ctx.globalAlpha = 1;
  }
}

// 菜单：选中项前面浮一颗小 ★，字更亮；变灰项用暗色、不可选

// 菜单导航（跳过变灰项）
function moveTitleSel(d) {
  const n = TITLE_MENU.length;
  for (let i = 0; i < n; i++) {
    titleSel = (titleSel + d + n) % n;

function activateTitleItem(i) {
  const it = TITLE_MENU[i];

// 把屏幕上的点换算回 960×544 的逻辑坐标 —— 画布被 CSS 缩放过，必须换算。
// 鼠标事件给 clientX/clientY，触摸事件给 touches/changedTouches，所以在这里统一取。
// 三处命中判定（封面菜单、右上角喇叭）共用这一个换算，别再各写一份。
function canvasPoint(e) {
  const t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
  const px = (t.clientX === undefined) ? 0 : t.clientX;
  const py = (t.clientY === undefined) ? 0 : t.clientY;
  // 手机竖屏时舞台被 CSS 转了 90°（见 MobileUI.apply）。这时画布的 getBoundingClientRect
  // 给的是"转完之后的外框"，不能再按它直接除 —— 要先把屏幕坐标转回舞台自己的坐标。
  // 少了这一步，竖屏旋转后封面菜单会点不准，评委可能就卡在标题页了。
  if (MOBILE && MobileUI.rotated && MobileUI.canvasIn) {
    const L = MobileUI.canvasIn, SH = MobileUI.stageH || 0;
    const lx = py, ly = SH - px;                     // 屏幕 → 舞台局部（x=Y, y=SH-X）
    return { x: (lx - L.x) / (L.w || W) * W, y: (ly - L.y) / (L.h || H) * H };
  }
  const r = (canvas && canvas.getBoundingClientRect)
    ? canvas.getBoundingClientRect() : { left: 0, top: 0, width: W, height: H };
  return { x: (px - r.left) / (r.width || W) * W, y: (py - r.top) / (r.height || H) * H };
}

// 封面的鼠标操作：悬停高亮 + 点击
function titleMenuHit(px, py) {
  for (let i = 0; i < TITLE_MENU.length; i++) {
    if (TITLE_MENU[i].enabled === false) continue;
    const y = TITLE_MENU_Y + i * TITLE_MENU_GAP;
    if (px >= W / 2 - 150 && px <= W / 2 + 150 && py >= y - 15 && py <= y + 15) return i;
  }
  return -1;
}
function initTitleMouse() {
  try {
    if (typeof window === 'undefined' || !canvas || !canvas.addEventListener) return;
    const toLogical = canvasPoint;      // 换算逻辑在 canvasPoint 里（鼠标/触摸共用一份）
    canvas.addEventListener('mousemove', (e) => {
      if (state !== 'title' || titlePanel) { if (canvas.style) canvas.style.cursor = 'default'; return; }
      const p = toLogical(e), i = titleMenuHit(p.x, p.y);
      if (i >= 0) titleSel = i;
      if (canvas.style) canvas.style.cursor = (i >= 0) ? 'pointer' : 'default';
    });
    canvas.addEventListener('click', (e) => {
      if (state !== 'title') return;
      const p = toLogical(e);
      if (titlePanel === 'settings') {
        const by = (H - 130) / 2;
        if (p.y >= by + 56 && p.y <= by + 88) { toggleAudioMute(); }
        else titlePanel = null;
        return;
      }
      if (titlePanel) { titlePanel = null; return; }
      const i = titleMenuHit(p.x, p.y);
      if (i >= 0) activateTitleItem(i);
    });
    // 手机：直接点菜单项。走 touchstart 而不是等 click —— 移动端 click 有约 300ms 延迟，
    // 点"开始游戏"会明显顿一下。这里要顺手把高亮挪过去（鼠标那条路是靠 mousemove 挪的）。
    canvas.addEventListener('touchstart', (e) => {
      if (state !== 'title') return;
      if (e.preventDefault) e.preventDefault();
      if (titlePanel === 'settings') {
        const p0 = toLogical(e), by = (H - 130) / 2;
        if (p0.y >= by + 56 && p0.y <= by + 88) toggleAudioMute();
        else titlePanel = null;
        return;
      }
      if (titlePanel) { titlePanel = null; return; }
      const p = toLogical(e), i = titleMenuHit(p.x, p.y);
      if (i >= 0) { titleSel = i; activateTitleItem(i); }
    }, { passive: false });
  } catch (e) { /* 非浏览器环境（截图工具）直接跳过 */ }
}

// 右上角小喇叭：代码画的（不用图），点击切换静音；M 键同效
function audioIconRect() { return { x: W - 44, y: 8, w: 32, h: 32 }; }
function drawAudioIcon() {
  const r = audioIconRect();
