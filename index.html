  ctx.fillStyle = 'rgba(44,30,15,0.82)';        // 跟左上角挂牌同一种深棕
  ctx.fill();
  ctx.fillStyle = off ? '#8d8aa6' : '#e8c97a';
  ctx.fillRect(r.x + 9, r.y + 13, 4, 7);        // 音箱
  ctx.beginPath();                              // 号角
  ctx.moveTo(r.x + 13, r.y + 16.5);
  ctx.lineTo(r.x + 18, r.y + 11);
  ctx.lineTo(r.x + 18, r.y + 22);
  ctx.lineTo(r.x + 13, r.y + 16.5);
  ctx.closePath(); ctx.fill();
  if (off) {                                    // 静音：一道斜杠
    ctx.strokeStyle = '#e07a9a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(r.x + 7, r.y + 24); ctx.lineTo(r.x + 26, r.y + 8); ctx.stroke();
  } else {                                      // 有声：两道弧（折线近似，避免依赖 arc 的实现差异）
    ctx.strokeStyle = '#e8c97a'; ctx.lineWidth = 1.6;
    for (const rad of [5, 8.5]) {
      ctx.beginPath();
      let first = true;
      for (let n = 0; n <= 12; n++) {
        const a = -0.85 + (1.7 * n / 12);
        const px = r.x + 19 + Math.cos(a) * rad, py = r.y + 16.5 + Math.sin(a) * rad;
        if (first) { ctx.moveTo(px, py); first = false; } else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
  }
}
function initAudioIcon() {
  try {
    if (typeof window === 'undefined' || !canvas || !canvas.addEventListener) return;
    const hit = (e) => {
      const p = canvasPoint(e), r = audioIconRect();
      return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
    };
    canvas.addEventListener('click', (e) => { if (hit(e)) { if (window.AudioEngine) AudioEngine.unlock(); toggleAudioMute(); } });
    canvas.addEventListener('mousemove', (e) => { if (canvas.style && hit(e)) canvas.style.cursor = 'pointer'; });
    // 手机：手指点喇叭也要能静音（同样不等 click）
    canvas.addEventListener('touchstart', (e) => {
      if (!hit(e)) return;
      if (e.preventDefault) e.preventDefault();
      if (window.AudioEngine) AudioEngine.unlock();
      toggleAudioMute();
    }, { passive: false });
  } catch (e) { /* 非浏览器环境跳过 */ }
}

// 淡出/淡入覆盖层（封面和游戏里共用一份）
function drawFadeOverlay() {
  if (!fade) return;
  const a = fade.phase === 'out' ? Math.min(1, fade.t / 0.6) : Math.max(0, 1 - fade.t / 0.6);
  ctx.fillStyle = 'rgba(8,6,18,' + a.toFixed(3) + ')';
  ctx.fillRect(0, 0, W, H);
}

// 结局字幕：逐行浮现，整块位置固定，新出现的一行淡入
function drawEndingLines(lines, lineDur, color, lh, topY) {
  const shown = Math.min(lines.length, Math.floor(endingT / lineDur) + 1);
  setFont(19, false);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  for (let i = 0; i < shown; i++) {
    const ln = lines[i];
    if (!ln) continue;
    const age = endingT - i * lineDur;
    ctx.globalAlpha = Math.max(0, Math.min(1, age / 0.6));
    ctx.fillText(ln, W / 2, topY + i * lh);
  }
  ctx.globalAlpha = 1;
}

// 阶段一 · 病床前：场景仍是地图 0 的卧室，只压暗 + 叠字幕
function drawEndingBed() {
  ctx.fillStyle = 'rgba(6,5,14,0.62)';
  ctx.fillRect(0, 0, W, H);
  const lh = 24;
  drawEndingLines(ENDING_BED, BED_LINE_T, '#e6e2f0', lh, (H - ENDING_BED.length * lh) / 2 + lh / 2);
}

// 阶段二 · 山顶：场景是地图 3（夜、星空），小满独自站着
function drawEndingHill() {
  ctx.fillStyle = 'rgba(6,5,14,0.55)';
  ctx.fillRect(0, 0, W, H);
  const lh = 26;
  drawEndingLines(ENDING_HILL, HILL_LINE_T, '#e6e2f0', lh, (H - ENDING_HILL.length * lh) / 2 + lh / 2);
}

// 阶段三 · 尾声：全屏，不给和解
function drawEndingEpilogue() {
  ctx.fillStyle = '#0a0914';
  ctx.fillRect(0, 0, W, H);
  const lh = 21;
  drawEndingLines(EPILOGUE, EPI_LINE_T, '#e6e2f0', lh, 34);

  const doneT = EPILOGUE.length * EPI_LINE_T;
  if (endingT > doneT) {
    const a = Math.min(1, (endingT - doneT) / 1.2);
    setFont(17, false);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#8b83a8';
    ctx.globalAlpha = a;
    for (let i = 0; i < EPILOGUE_NOTE.length; i++) ctx.fillText(EPILOGUE_NOTE[i], W / 2, H - 86 + i * 24);
    ctx.globalAlpha = 1;
    if (endingT > doneT + 1.5 && Math.sin(time * 3) > -0.2) {
      text('按 R 重新开始', W / 2, H - 24, 16, '#6f6790', 'center', false);
    }
  }
}

// 阶段四 · 草地：场景是地图 3（草地），小满躺在上面看星星，台词逐行滚动
function drawEndingGrass() {
  // 插画本身已经是夜色 + 星空了，这里只压一层暗，保证字幕读得清
  ctx.fillStyle = 'rgba(6,5,14,0.45)';
  ctx.fillRect(0, 0, W, H);
  const cur = grassLine;
  const lh = 34, cy = 176;
  setFont(20, false);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < ENDING_GRASS.length; i++) {
    const dy = i - cur;
    if (Math.abs(dy) > 3) continue;
    // 只有当前这句在淡入；后面的句子一律不画 —— 按键推进，不该提前剧透
    const t = i < cur ? 1 : (i === cur ? Math.min(1, grassFade / GRASS_FADE) : 0);
    if (t <= 0) continue;
    ctx.globalAlpha = t * (dy === 0 ? 1 : 0.3);
    ctx.fillStyle = dy === 0 ? '#f2efe6' : '#9a93b8';
    ctx.fillText(ENDING_GRASS[i], W / 2, cy + dy * lh);
  }
  ctx.globalAlpha = 1;
  const atEnd = grassLine >= ENDING_GRASS.length - 1 && grassFade >= GRASS_FADE;
  if (atEnd) {
    if (Math.sin(time * 3) > -0.2) text('按 R 重新开始', W / 2, H - 26, 16, '#6f6790', 'center', false);
  } else if (grassFade >= GRASS_FADE && Math.sin(time * 3) > -0.4) {
    // 等按键时才提示，否则玩家会干等；不想要这行字的话删掉这个分支即可
    text('空格 / E 继续', W / 2, H - 26, 15, '#8f88a8', 'center', false);
  }
  ctx.textBaseline = 'middle';
}

// 结局收尾：先 2 秒把画面压成纯黑，再在正中淡入两行告别文字
function drawEndingOutro() {
  const a = outroStage === 0 ? Math.min(1, outroT / OUTRO_BLACK) : 1;
  ctx.fillStyle = 'rgba(0,0,0,' + a.toFixed(3) + ')';
  ctx.fillRect(0, 0, W, H);
  if (outroStage !== 1) return;
  const t = Math.min(1, outroT / 0.8);                    // 文字淡入 0.8 秒
  ctx.save();
  ctx.globalAlpha = t;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  // 衬线体比 UI 的黑体安静。注意 Georgia 没有中文字形，所以必须显式补上
  // 中文衬线的回退（宋体系）—— 否则中文会掉到系统默认字体，
  // 有的机器上直接变黑体，"优雅"就没了。
  ctx.font = '21px Georgia, "Times New Roman", "Songti SC", "SimSun", serif';
  ctx.fillStyle = '#f0e6cd';                              // 柔和暖白
  ctx.fillText('这是一个普及死亡教育的小游戏', W / 2, H / 2 - 24);
  ctx.fillStyle = '#e8c97a';                              // 淡金
  ctx.fillText('希望每一位玩家能够得到帮助，谢谢', W / 2, H / 2 + 24);
  ctx.restore();
  if (outroT > 1.0 && Math.sin(time * 3) > -0.4) {        // 安静的返回提示
    ctx.globalAlpha = 0.45 * t;
    ctx.font = '13px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#9a93b8';
    ctx.fillText('按任意键返回主菜单', W / 2, H - 44);
    ctx.globalAlpha = 1;
  }
}

function drawEnding() {
  if (endingPhase === 'grass') drawEndingGrass();
  else if (endingPhase === 'outro') drawEndingOutro();
  else if (endingPhase === 'bed') drawEndingBed();
  else if (endingPhase === 'hill') drawEndingHill();
  else drawEndingEpilogue();
}

function render() {
  if (state === 'title') { drawTitle(); drawAudioIcon(); drawFadeOverlay(); return; }
  if (state === 'ending' && endingPhase === 'epilogue') { drawEnding(); return; }
  if (act >= 2 && PLACEHOLDER[currentMap]) { drawPlaceholder(); return; }
  drawBackground();
  const bgMap = MAP_BG[currentMap];
  if (bgMap) {
    // 插画背景地图：整幅手绘图铺满，瓦片/家具层整体跳过（图未加载好则回退）
    if (!drawMapBG(bgMap)) { drawTiles(); drawMapDecor(); }
  } else {
    drawTiles();
    drawMapDecor();
    drawWater();
  }
  drawExits();
  drawActors();
  if (MAPS[currentMap].dream) {
    ctx.fillStyle = 'rgba(255,214,140,0.05)';
    ctx.fillRect(0, 0, W, H);
    drawDreamParticles();
  }
  drawExitHint();
  drawIndicator();
  drawAudioIcon();     // 右上角小喇叭：所有状态下都在
  if (state !== 'ending' && act >= 2) drawHUD();   // 第一幕是葬礼，不显示进度；从入梦起才有碎片
  if (banner && state !== 'dialogue') drawBanner();
  if (dialogue) drawDialogue();
  if (state === 'ending') drawEnding();
  drawFadeOverlay();
}

// ---------- 场景切换 UI 箭头（DOM 覆盖层，替代原来的出口区域）----------
// 每个「有下一幕」的地图在这里登记目标；没有登记的地图不显示箭头。
const SCENE_NEXT = {};   // 保留接口但不再使用：出口已改回「走过去」触发

const SceneUI = {
  el: null, shown: null,
  init() {
    try {
      if (typeof document === 'undefined' || !document.createElement || !document.head) return;
      const canvasEl = document.getElementById('game');
      if (!canvasEl || !canvasEl.parentNode) return;
      // 用相对定位的容器包住画布，箭头用百分比定位即可随画布一起缩放
      let holder = document.getElementById('scene-holder');
      if (!holder) {
        holder = document.createElement('div');
        holder.id = 'scene-holder';
        canvasEl.parentNode.insertBefore(holder, canvasEl);
      }
      holder.appendChild(canvasEl);

      const st = document.createElement('style');
      st.textContent = [
        '#scene-holder{position:relative;display:inline-block;line-height:0;}',
        '#scene-arrow{position:absolute;right:6%;bottom:3%;width:9%;min-width:42px;max-width:96px;',
        'padding:0;border:0;background:none;cursor:pointer;line-height:0;',
        '-webkit-tap-highlight-color:transparent;animation:sceneBreath 1.7s ease-in-out infinite;}',
        '#scene-arrow:hover{animation:none;opacity:1;transform:scale(1.14);}',
        '#scene-arrow:active{transform:scale(1.02);}',
        '#scene-arrow img{width:100%;height:auto;display:block;}',
        '@keyframes sceneBreath{0%,100%{opacity:.45;}50%{opacity:1;}}',
      ].join('');
      document.head.appendChild(st);

      const btn = document.createElement('button');
      btn.id = 'scene-arrow';
      btn.type = 'button';
      btn.setAttribute('aria-label', '前往下一个场景');
      // 手绘木质箭头（和地图内的出口提示是同一张图）。文字提示按要求全部取消。
      // 这里留空，由 loadArt() 注入图片；加载不出来就是空的，不再退回粉色箭头。
      btn.innerHTML = '';

      holder.appendChild(btn);

      btn.addEventListener('click', () => {
        const n = SCENE_NEXT[currentMap];
        if (n && state === 'play') enterMap(n.m, n.tx, n.ty);
      });

      this.el = btn;
      this.loadArt();                 // 注入 assets/arrow_next.png
    } catch (e) { /* 非浏览器环境（截图工具）直接跳过 */ }
  },
  loadArt() {
    try {
      const probe = new Image();
      probe.onload = () => {
        if (!this.el) return;
        this.el.innerHTML = '';
        const im = document.createElement('img');
        im.src = 'assets/arrow_next.png';
        im.alt = '前往下一个场景';
        this.el.appendChild(im);
      };
      probe.onerror = () => {};       // 没有这张图就继续用代码画的箭头
      probe.src = 'assets/arrow_next.png';
    } catch (e) {}
  },
  sync() {
    if (!this.el) return;
    const want = !!(SCENE_NEXT[currentMap] && state === 'play');
    if (want === this.shown) return;
    this.shown = want;
    this.el.style.display = want ? 'block' : 'none';
  },
};

// ================= 移动端（手机浏览器）=================
// 挑战杯要让评委扫码在手机上玩，所以外挂一层原生 DOM/CSS，引擎本身几乎不动：
//   · 虚拟摇杆（左下）+ 交互按钮（右下）→ 调的就是上面那对 inputDown/inputUp，
//     和键盘走【同一条路】：pressQueue 去重、hPress 的"左右同时按时先按下的赢"、
//     音频手势解锁，全都不用再写一遍。
//   · 画布等比完整显示（不裁切、不变形），两侧空出来的地方用当前场景的底图【模糊放大】铺满
//     —— 不是黑边。"铺满 + 不裁切 + 不变形"三者只能选两个，这里选"不裁切不变形"：
//     裁切会切掉左上角星星挂牌和底部对话框，那才是真出事。
//   · 头部 viewport 禁止双指缩放；竖屏时盖一层「请横屏」。
// 判定不是触屏设备就【一行都不执行】—— 保证 PC 端和所有 Node 测试脚本的行为一字不变。
const MOBILE_UI_SCALE  = 1.25;   // 左上角挂牌放大倍数（旋钮）
const MOBILE_DLG_SCALE = 1.15;   // 对话框字号 / 头像 / 行距放大倍数（旋钮）
const MOBILE_PAD_R     = 62;     // 摇杆半径下限（CSS 像素）
const MOBILE_PAD_R_MAX = 92;     // 半径上限：再大就盖住画面了
const MOBILE_PAD_R_FRAC = 0.21;  // 实际半径 = 屏幕短边 × 这个比例，再夹到上下限之间
                                 // （原来固定 124px 直径，手机上拇指根本对不准 —— 那是"操作困难"的头号原因）
const MOBILE_PAD_DEAD  = 0.22;   // 摇杆死区（占半径的比例）：手还在圆心附近时不算方向
const MOBILE_DIR_RATIO = 1.75;   // 轴向优先倍数：主要分量比次分量大这么多就只走一个方向（±30°）
const MOBILE_BLUR      = 16;     // 两侧铺底的模糊半径（px）
const MOBILE_BLUR_W = 240, MOBILE_BLUR_H = 136;   // 铺底用的小画布（糊了看不出来，越小越省）
const MOBILE_VP = 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';
let MOBILE = false;              // 是不是移动端。uiS()/uiD() 读它，绘制层靠它决定放大多少

function uiS() { return MOBILE ? MOBILE_UI_SCALE : 1; }    // 挂牌倍数
function uiD() { return MOBILE ? MOBILE_DLG_SCALE : 1; }   // 对话框倍数

const MobileUI = {
  on: false, frame: 0, held: [], padId: null, actId: null, actOn: false, fsTried: false, bgName: null,
  rotated: false, stageW: 0, stageH: 0, canvasIn: null,

  // ---- 判定：手机/平板浏览器。任一条不满足就按桌面处理 ----
  // 测试/截图工具的 document 没有 head/body，这里必然返回 false —— 那是刻意的。
  // 注意【不能拿"屏幕小"当主要判据】：手机横屏时 innerHeight 就是 1080，
  // 拿它比大小会把手机判成桌面。所以先看触摸能力，再用 UA 认手机；
  // 没有手机 UA 的（平板"请求桌面版"、未知浏览器）退一步看物理屏幕尺寸，
  // 这样【触摸屏笔记本】不会被误判 —— 那上面键盘鼠标更好用，画面不该被虚拟键占住。
  detect() {
    try {
      if (typeof window === 'undefined' || typeof document === 'undefined') return false;
      if (!document.createElement || !document.head || !document.body) return false;
      const nt = (typeof navigator !== 'undefined') ? (navigator.maxTouchPoints || 0) : 0;
      if (!(('ontouchstart' in window) || nt > 0)) return false;
      const ua = (typeof navigator !== 'undefined' && navigator.userAgent) || '';
      if (/Android|iPhone|iPod|iPad|Mobile|Silk|Kindle|Windows Phone|BlackBerry|Opera Mini/i.test(ua)) return true;
      const sw = (typeof screen !== 'undefined' && screen && screen.width) || 0;
      const sh = (typeof screen !== 'undefined' && screen && screen.height) || 0;
      return Math.min(sw || 1e9, sh || 1e9) <= 820;   // 平板（820×1180）算，笔记本（1080+）不算
    } catch (e) { return false; }
  },

  // ---- 布局：960×544 等比 fit 进屏幕（纯函数，测试直接调）----
  layout(vw, vh) {
    const scale = Math.min(vw / W, vh / H);
    const w = W * scale, h = H * scale;
    return { scale: scale, w: w, h: h, left: (vw - w) / 2, top: (vh - h) / 2 };
  },

  // ---- 摇杆向量 → 方向键（纯函数）----
  // 不再用 8 等分扇区（每 45° 一个）。那种切法拇指稍微歪一点就跳成斜向，
  // 人就斜着往墙上蹭 —— 手机上特别难用，也是"操作困难"的来源之一。
  // 改成【轴向优先】：主要分量比次分量大 MOBILE_DIR_RATIO 倍以上就只走一个方向
  // （换算过来左右各 ±30° 以内都算直行），只有两个分量确实相当才算斜向。
  // 斜向不加速仍然由引擎负责（见 update 里的 0.7071）。
  dirsOf(dx, dy, mag) {
    if (mag < MOBILE_PAD_DEAD) return [];
    const ax = Math.abs(dx), ay = Math.abs(dy);
    const h = dx > 0 ? 'ArrowRight' : 'ArrowLeft', v = dy > 0 ? 'ArrowDown' : 'ArrowUp';
    if (ax > ay * MOBILE_DIR_RATIO) return [h];
    if (ay > ax * MOBILE_DIR_RATIO) return [v];
    return [h, v];
  },

  // 屏幕坐标 → 舞台局部坐标。竖屏时舞台整体转了 90°（见 apply），屏幕上的 (px,py)
  // 对应舞台里的 (py, SH-px) —— 不转回来，摇杆算出来的方向就是歪的。
  stagePoint(e) {
    const t = (e.changedTouches && e.changedTouches[0]) || (e.touches && e.touches[0]) || e;
    const px = (t.clientX === undefined) ? 0 : t.clientX;
    const py = (t.clientY === undefined) ? 0 : t.clientY;
    if (this.rotated) return { x: py, y: (this.stageH || 0) - px };
    return { x: px, y: py };
  },

  // 把摇杆圆心摆到舞台局部坐标 (x,y)：按住屏幕时它就在拇指底下，松手滑回左下角。
  // 用 left/bottom 写位置（CSS 里给了 .16s 过渡），所以是"滑过去"而不是"跳过去"。
  placePad(x, y) {
    const R = this.padR || MOBILE_PAD_R, SW = this.stageW || 0, SH = this.stageH || 0;
    const cx = Math.min(Math.max(x, R + 6), Math.max(R + 6, SW - R - 6));
    const cy = Math.min(Math.max(y, R + 6), Math.max(R + 6, SH - R - 6));
    if (this.pad && this.pad.style) {
      this.pad.style.left = (cx - R).toFixed(0) + 'px';
      this.pad.style.bottom = (SH - cy - R).toFixed(0) + 'px';
    }
    if (this.knob && this.knob.style) this.knob.style.transform = '';
  },
  // 回到左下角（让开安全区：旋转过的安全区已经换过边，见 apply）
  padGoHome() {
    const R = this.padR || MOBILE_PAD_R, SH = this.stageH || 0;
    const si = this.ins || { t: 0, r: 0, b: 0, l: 0 };
    this.placePad(20 + si.l + R, SH - 20 - si.b - R);
  },
  // 点一下（没拖）= 按一下动作键：推进对话 / 确认选项 / 结局继续 / 走到物件前点一下交互。
  // 手机上"点屏幕哪儿都行"比让人去找右下角那枚 E 好按太多。
  // 封面不走这条路 —— 封面要按菜单项命中（见 initTitleMouse），乱点会误触"开始游戏"。
  tap() {
    if (state === 'title') return;
    inputDown('e');
    inputUp('e');
  },

  init() {
    if (this.on) return true;
    if (!this.detect()) return false;
    MOBILE = true;
    try {
      this.setViewport(); this.injectCSS(); this.build(); this.bind(); this.apply();
      this.syncOrient();                 // 竖屏才显示"手机横过来"提示（见 isPortraitNumeric）
      this.on = true;
      return true;
    } catch (e) {
      MOBILE = false; this.on = false;      // 注入失败就退回桌面行为，别把游戏搞挂
      // 但【必须留下痕迹】：曾经有一个没声明的变量让整层注入静默失效 ——

    cst.position = 'fixed';
    cst.left = this.canvasIn.x.toFixed(1) + 'px';   cst.top = this.canvasIn.y.toFixed(1) + 'px';
    cst.width = L.w.toFixed(1) + 'px';              cst.height = L.h.toFixed(1) + 'px';
    cst.maxWidth = 'none'; cst.maxHeight = 'none';

    // 摇杆/按钮的位置也按【换过边的安全区】算：旋转后 CSS 的 env(safe-area-*) 对应的是
    // 屏幕的边，不是玩家的边，直接用会被刘海/横条啃掉。
    // 摇杆：半径按屏幕短边定（原来固定 124px 直径，拇指对不准），位置回左下角。
    // 注意用的是 si（换过边的安全区）—— 竖屏旋转之后，它才是"玩家看到的左下角"。
    this.ins = { t: si.t, r: si.r, b: si.b, l: si.l };
    const padR = Math.round(Math.min(MOBILE_PAD_R_MAX,
      Math.max(MOBILE_PAD_R, Math.min(SW, SH) * MOBILE_PAD_R_FRAC)));
    this.padR = padR;
    if (this.pad && this.pad.style) {
      this.pad.style.width = (padR * 2) + 'px';
      this.pad.style.height = (padR * 2) + 'px';
    }
    if (!this.padId) this.padGoHome();       // 正在被按住就别抢位置
    if (this.act && this.act.style) {
      this.act.style.right = (24 + si.r).toFixed(0) + 'px';
      this.act.style.bottom = (24 + si.b).toFixed(0) + 'px';
    }
    if (this.fsBtn && this.fsBtn.style) {
      this.fsBtn.style.right = (12 + si.r).toFixed(0) + 'px';
      // 往下让开 52px：右上角那个位置游戏自己画了静音喇叭（在画布的 8~40px 处）
      this.fsBtn.style.top = (52 + si.t).toFixed(0) + 'px';
    }
    this.syncOrient();
  },

  // 只按差量发按下/抬起：方向没变就什么都不做（省得 pressQueue 被灌满、hPress 顺序被打乱）
  applyDirs(want) {
    const held = this.held;
    for (let i = 0; i < held.length; i++) if (want.indexOf(held[i]) === -1) inputUp(held[i]);
    for (let i = 0; i < want.length; i++) if (held.indexOf(want[i]) === -1) inputDown(want[i]);
    this.held = want.slice();
  },

  tick() {
    if (!this.on) return;
    // 有对话或不在游玩状态时，摇杆淡到几乎看不见 —— 它压着对话框的左半边
    const busy = (state !== 'play') || !!dialogue;
    if (this.pad && this.pad.classList) { if (busy) this.pad.classList.add('dim'); else this.pad.classList.remove('dim'); }
    if ((this.frame++ % 3) !== 0) return;      // 铺底每 3 帧刷一次就够（它本来就是糊的）
    this.backdrop();
  },

  // 两侧铺底：优先拿【当前场景的底图】当 CSS 背景（不受"画布被跨域污染"影响，
  // 直接双击打开 html 也能用）；纯瓦片地图没有底图，就退回把游戏画布缩一份贴上去；
  // 都不行就只剩深色底 —— 不会开天窗，也不会报错。
  backdrop() {
    try {
      const name = (typeof bgImageName === 'function') ? bgImageName(currentMap) : null;
      if (name) {
        if (name !== this.bgName && this.blurEl && this.blurEl.style) {
          this.bgName = name;
          this.blurEl.style.backgroundImage = 'url(assets/' + name + '.png)';
        }
        return;
      }
      const c = this.blurCtx, el = this.blurEl;
      if (!c || !el) return;
      const bw = el.width || MOBILE_BLUR_W, bh = el.height || MOBILE_BLUR_H;
      const k = Math.max(bw / W, bh / H);                 // cover：宁可裁掉一点，也不留边
      c.drawImage(canvas, (bw - W * k) / 2, (bh - H * k) / 2, W * k, H * k);
      if (el.style) el.style.backgroundImage = 'none';
    } catch (e) { /* file:// 下读画布会被浏览器安全策略拦下 —— 保持深色底即可 */ }
  },
};

// ---------- 主循环 ----------
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  render();
  MobileUI.tick();      // 手机端：对话时淡出摇杆 + 每 3 帧刷一次模糊铺底（非手机端立刻返回）
  requestAnimationFrame(loop);
}
ImageLoader.load();   // 启动即开始加载 assets/ 图片（异步；缺失自动回退）
initTitleMouse();     // 封面的悬停高亮 / 点击 / 触摸
initAudioIcon();      // 右上角小喇叭的点击 / 触摸
MobileUI.init();      // 手机（触屏）才生效：虚拟摇杆 + 交互按钮 + 等比铺满 + 禁止缩放
syncBGM();            // 开场先放主菜单那首（浏览器限制下要等第一次手势才真的出声）
requestAnimationFrame(loop);
</script>
</body>
</html>
